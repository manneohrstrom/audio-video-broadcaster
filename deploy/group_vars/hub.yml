pinned_packages_group:
  ffmpeg: "8:7.1.5-0+deb13u1+rpt2"
  mkvtoolnix: "92.0-1+deb13u1"
  exfatprogs: "1.2.9-1+deb13u1"
  python3-opencv: "4.10.0+dfsg-5"
  python3-numpy: "1:2.2.4+ds-1"   # render (edit_render.py), grade.py, add_overlay.py
  alsa-utils: "1.2.14-1+rpt1"
hubd_port: 80
hubd_sync_server: cam1
# Recording light (Phase 4 C1, hub/hubd/lamp.py). type: tasmota | esphome | log | null.
# Fill in when the bulb is set up: firmware type and its reserved IP (esphome also needs light_id).
hubd_lamp:
  type: tasmota        # LocalBytes bulb, Tasmota 11.1.0 (checked 2026-11-16)
  address: 192.168.68.70   # DHCP reservation on the router
  looks:
    ready: {dim: 0}      # user, 2026-11-16: off when nothing is happening
    ingest_done: {dim: 0}   # user, 2026-11-16: no purple "safe to eject" either
    ingest: {rgb: [150, 0, 255]}   # user, 2026-11-16: ingest pulses purple, not cyan
# Hub mic (scratch.py): mixer set before every recording. C-Media "USB PnP Sound Device":
# Mic 0-16 (6 = about 9 dB: loud claps near the hub just below clipping, 2026-11-16).
hubd_scratch:
  mixer:
    Mic: 6
    "Auto Gain Control": "off"
# Ingest (docs/phase3-plan.md): starts after this long idle, or "Ingest now".
ingest_idle_minutes: 30
ingest_x264_preset: veryfast
ingest_x264_crf: "16"
# "real": -c copy at real frame times (editor plan M-E1, since 2026-11-16); "conform": re-encode to 30 fps
ingest_video_timing: real
