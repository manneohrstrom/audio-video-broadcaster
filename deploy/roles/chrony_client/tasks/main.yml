- name: Node chrony config (hub is the only source)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../node/chrony/studio-node.conf"
    dest: /etc/chrony/conf.d/studio-node.conf
    mode: "0644"
  notify: Restart chrony

- name: Disable stock pool and DHCP-supplied NTP sources
  ansible.builtin.replace:
    path: /etc/chrony/chrony.conf
    regexp: '^(pool .*|sourcedir /run/chrony-dhcp)$'
    replace: '#\1'
  notify: Restart chrony

- name: Chrony enabled and running
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started
