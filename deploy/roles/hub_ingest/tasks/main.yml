- name: hub-ingest directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0755"
  loop:
    - {path: /opt/hub-ingest, owner: root}
    - {path: /var/lib/hubd/ingest, owner: studio}
    - {path: /var/lib/hubd/ingest/commands, owner: studio}
    # Mount point for the STUDIO drive (mounted only while writing).
    - {path: /mnt/studio, owner: studio}

- name: hub-ingest code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hub/ingest/ingest.py"
    dest: /opt/hub-ingest/ingest.py
    mode: "0755"
  notify: Restart hub-ingest

- name: hub-ingest quick mix renderer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hub/ingest/render.py"
    dest: /opt/hub-ingest/render.py
    mode: "0644"
  notify: Restart hub-ingest

- name: hub-ingest automatic bounce sync
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hub/ingest/audiosync.py"
    dest: /opt/hub-ingest/audiosync.py
    mode: "0644"
  notify: Restart hub-ingest

- name: hub-ingest strip thumbnails for the editor
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hub/ingest/thumbnails.py"
    dest: /opt/hub-ingest/thumbnails.py
    mode: "0644"
  notify: Restart hub-ingest

- name: hub-ingest editing proxies for the editor
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hub/ingest/proxies.py"
    dest: /opt/hub-ingest/proxies.py
    mode: "0644"
  notify: Restart hub-ingest

- name: hub-ingest renderer of the editor's edits (and the look, shared with the editor)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hub/ingest/{{ item }}"
    dest: "/opt/hub-ingest/{{ item }}"
    mode: "0644"
  loop: [edit_render.py, story_render.py, look_render.py, camera_move.py, grade.py, title_render.py, youtube_upload.py]
  notify: [Restart hub-ingest, Restart hub-upload]

- name: hub-ingest analysis for the automatic cut (beats of each bounce, movement per camera)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hub/ingest/{{ item }}"
    dest: "/opt/hub-ingest/{{ item }}"
    mode: "0644"
  loop: [beats.py, motion.py]
  notify: Restart hub-ingest

- name: hub-ingest drive records (the STUDIO drive as the record of every take, docs/stick-db-plan.md)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hub/ingest/drive_records.py"
    dest: /opt/hub-ingest/drive_records.py
    mode: "0644"
  notify: Restart hub-ingest

- name: hub-ingest config
  ansible.builtin.copy:
    dest: /etc/hubd/ingest.json
    mode: "0644"
    content: "{{ cfg | to_nice_json }}\n"
  vars:
    cfg:
      nodes: "{{ groups['nodes'] }}"
      node_port: "{{ hostvars[groups['nodes'][0]].camnode_port }}"
      hub_api: "http://127.0.0.1:{{ hubd_port }}"
      ssh_key: /home/studio/.ssh/id_ingest
      state_dir: /var/lib/hubd/ingest
      drive_label: STUDIO
      mount_point: /mnt/studio
      idle_minutes: "{{ ingest_idle_minutes }}"
      x264_preset: "{{ ingest_x264_preset }}"
      x264_crf: "{{ ingest_x264_crf }}"
      video_timing: "{{ ingest_video_timing }}"
      phones_dir: /var/lib/hubd/phones
  notify: Restart hub-ingest

# The unit's MemoryMax/MemorySwapMax only work with the kernel's memory controller, and
# Raspberry Pi OS boots with cgroup_disable=memory (found 2026-11-28: a render ran the
# whole hub out of memory through a cap that was never enforced). Takes effect at the
# next reboot; this playbook doesn't reboot.
- name: Kernel memory controller on, so the hub-ingest memory cap is enforced (after a reboot)
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    regexp: '^((?!.*\bcgroup_enable=memory\b).*)$'
    line: '\1 cgroup_enable=memory'
    backrefs: true

# A safety net for renders (user, 2026-11-28: "slows down rather than crashes"): a swap file
# on the SD card behind zram. rpi-swap keeps zram0 (priority 100; its /var/swap is zram's
# idle-page writeback, not swap); this file has priority 10, so the kernel uses it only once
# zram is full. hub-ingest's MemorySwapMax bounds how much of it a render can take.
- name: Overflow swap file on the SD card (2 GB)
  ansible.builtin.command: fallocate -l 2G /var/swap-overflow
  args:
    creates: /var/swap-overflow
  register: overflow_swap_file

- name: Overflow swap file readable by root only
  ansible.builtin.file:
    path: /var/swap-overflow
    mode: "0600"
    owner: root
    group: root

- name: Overflow swap file formatted as swap
  ansible.builtin.command: mkswap /var/swap-overflow
  when: overflow_swap_file is changed

- name: Overflow swap file used at every boot, after zram
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/var/swap-overflow\s'
    line: /var/swap-overflow none swap sw,pri=10 0 0

- name: Is the overflow swap file on?
  ansible.builtin.command: grep -q '^/var/swap-overflow ' /proc/swaps
  register: overflow_swap_on
  changed_when: false
  failed_when: false
  check_mode: false

- name: Overflow swap file on now
  ansible.builtin.command: swapon -p 10 /var/swap-overflow
  when: overflow_swap_on.rc != 0

- name: hub-ingest systemd unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hub/systemd/hub-ingest.service"
    dest: /etc/systemd/system/hub-ingest.service
    mode: "0644"
  notify: Restart hub-ingest

- name: hub-ingest enabled and running
  ansible.builtin.systemd_service:
    name: hub-ingest
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"

# YouTube (docs/youtube-plan.md): hub-upload sends the finished videos the editor marks
# "YouTube" to the channel, private. The login is made once on the Mac with
# mac/youtube_login.py; it lives outside the repo and is copied here only if it exists.
- name: YouTube folders (the login and the videos waiting to upload; only studio can read them)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: studio
    group: studio
    mode: "0700"
  loop: [/var/lib/hubd/youtube, /var/lib/hubd/youtube/uploads]

- name: Is there a YouTube login on this Mac?
  ansible.builtin.stat:
    path: "{{ youtube_credentials_local }}"
  delegate_to: localhost
  become: false
  register: youtube_login

- name: YouTube login
  ansible.builtin.copy:
    src: "{{ youtube_credentials_local }}"
    dest: /var/lib/hubd/youtube/credentials.json
    owner: studio
    group: studio
    mode: "0600"
  when: youtube_login.stat.exists
  no_log: true
  notify: Restart hub-upload

- name: hub-upload systemd unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hub/systemd/hub-upload.service"
    dest: /etc/systemd/system/hub-upload.service
    mode: "0644"
  notify: Restart hub-upload

- name: hub-upload enabled and running
  ansible.builtin.systemd_service:
    name: hub-upload
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
