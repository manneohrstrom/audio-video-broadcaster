# /etc/NetworkManager/conf.d/wifi-powersave-off.conf on cam1..camN
# Wi-Fi power saving off on the nodes (settled decision). With it on, the
# brcmfmac driver buffers broadcast/multicast until DTIM beacons, delaying
# rpicam-vid sync messages and adding latency spikes to live streams.
# 2 = disable. Applies on the next (re)connect; `iw dev wlan0 set power_save off`
# applies it immediately.
[connection]
wifi.powersave = 2
