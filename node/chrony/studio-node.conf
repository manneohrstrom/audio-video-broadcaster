# /etc/chrony/conf.d/studio-node.conf on cam1..camN
# The hub is the only time source. In /etc/chrony/chrony.conf on nodes, the
# stock "pool" line and "sourcedir /run/chrony-dhcp" are commented out (the
# router hands out an unreachable public NTP server via DHCP).
# If the hub's IP changes, restart chrony on the nodes (or give the hub a
# DHCP reservation) so studio-hub.local is resolved again.
# Poll every 16-64 s so camera clocks track the hub tightly.
server studio-hub.local iburst minpoll 4 maxpoll 6
# Step the clock only during the first 3 updates after start (boot);
# after that, only slew, so a take never sees a time jump.
makestep 0.1 3
