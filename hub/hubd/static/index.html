<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Multicam</title>
<style>
  :root { --bg:#111; --card:#1c1c1e; --fg:#eee; --dim:#888; --ok:#3c3; --warn:#e90; --bad:#e33; --rec:#d22; --live:#27e; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  h1 { font-size:18px; margin:0 0 12px; display:flex; gap:12px; align-items:baseline; }
  h1 small { color:var(--dim); font-weight:normal; }
  h1 .phonelinks { margin-left:auto; display:flex; gap:6px; }
  h1 .phonelink { min-width:0; border:0; cursor:pointer; font-family:inherit; font-size:14px; font-weight:600; color:#fff; background:#333; padding:6px 12px; border-radius:8px; text-decoration:none; }
  .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  button { font:inherit; font-size:20px; font-weight:600; padding:16px 28px; border:0; border-radius:10px; color:#fff; cursor:pointer; min-width:140px; }
  button:disabled { opacity:.35; cursor:default; }
  #rec { background:var(--rec); } #stop { background:#555; } #live { background:var(--live); }
  #rigbox { margin-left:auto; align-self:center; text-align:right; }
  #rig { font-size:22px; font-weight:700; }
  #budget { font-size:14px; color:var(--dim); } #budget.warn { color:var(--warn); font-weight:700; }
  #rig.recording { color:var(--rec); } #rig.starting, #rig.stopping { color:var(--warn); }
  #msg { min-height:1.4em; margin-bottom:12px; color:var(--warn); white-space:pre-line; }
  #msg.err { color:var(--bad); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
  .card { background:var(--card); border-radius:10px; padding:12px 14px; border-left:5px solid var(--dim); }
  .card.ok { border-color:var(--ok); } .card.warn { border-color:var(--warn); } .card.off { border:1px dashed #444; border-left:5px dashed #555; background:#151516; opacity:.55; }
  .card.recording { border-color:var(--rec); background:#2a1414; box-shadow:0 0 0 1px #5a1c1c inset; } .card.live { border-color:var(--live); }
  .card.recording .mode { color:#ff5a5a; font-weight:700; }
  .card.off .mode { color:#777; }
  .recdot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--rec); margin-right:5px; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .card h2 { margin:0 0 6px; font-size:17px; display:flex; justify-content:space-between; }
  .mode { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; font-size:13px; }
  .kv span:nth-child(odd) { color:var(--dim); }
  .problems { color:var(--warn); font-size:13px; margin-top:6px; }
  .url { margin-top:8px; display:flex; gap:6px; }
  .url input { flex:1; min-width:0; background:#000; color:var(--dim); border:1px solid #333; border-radius:6px; font:12px ui-monospace, monospace; padding:4px 6px; }
  .url button { font-size:12px; padding:4px 8px; min-width:0; background:#333; }
  .url a.pv { font-size:12px; padding:4px 8px; border-radius:6px; background:var(--live); color:#fff; text-decoration:none; align-self:center; }
  .url a.pv.off { background:#333; color:var(--dim); pointer-events:none; }
  section { margin-top:18px; } section h3 { font-size:15px; margin:0 0 6px; color:var(--dim); }
  table { border-collapse:collapse; font-size:13px; width:100%; max-width:720px; }
  td, th { text-align:left; padding:3px 10px 3px 0; border-bottom:1px solid #2a2a2a; }
  .bad { color:var(--bad); } .good { color:var(--ok); }
  .controls.small button { font-size:14px; padding:8px 14px; min-width:0; background:#333; }
  .step { font-size:12px; color:var(--dim); }
  #ingest-status { margin-bottom:8px; } #ingest-status b { font-weight:600; }
  .take { background:var(--card); border-radius:10px; padding:10px 12px; margin-bottom:8px; max-width:720px; border-left:5px solid #333; }
  .take.active { border-color:var(--live); } .take.done { border-color:var(--ok); } .take.error { border-color:var(--bad); }
  .take.waiting { border-color:var(--warn); }
  .take h4 { margin:0 0 6px; font-size:14px; display:flex; justify-content:space-between; gap:4px 12px; flex-wrap:wrap; }
  .take h4 small { color:var(--dim); font-weight:normal; }
  .camrow { display:grid; grid-template-columns:minmax(44px, max-content) 1fr; gap:6px; align-items:start; margin:6px 0 2px; }
  .camname { font-weight:600; font-size:13px; padding-top:3px; }
  .steps { display:flex; gap:5px; flex-wrap:wrap; }
  .st { font-size:12px; padding:3px 8px; border-radius:6px; background:#262628; color:var(--dim); display:inline-flex; gap:6px; align-items:center; white-space:nowrap; }
  .st.done { color:var(--ok); } .st.cur { background:#1d3557; color:#fff; } .st.err { background:#4a1515; color:#fff; }
  .bar { width:48px; height:4px; background:#445; border-radius:2px; overflow:hidden; } .bar i { display:block; height:100%; background:#7ab8ff; }
  .spin { width:9px; height:9px; border:2px solid #fff; border-right-color:transparent; border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .camerr { color:var(--bad); font-size:12px; margin:2px 0 0 50px; }
  .camdone { font-size:13px; color:var(--dim); }
  button.play { font-size:12px; font-weight:600; padding:3px 9px; min-width:0; border-radius:6px; background:#2b3a55; }
  .plays { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  #player { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  #player[hidden], #qr[hidden] { display:none; }
  #qr { position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; padding:16px; z-index:11; }
  .qrbox { background:#fff; color:#111; border-radius:12px; padding:20px 24px; text-align:center; max-width:340px; width:100%; }
  .qrbox svg { width:100%; height:auto; display:block; }
  .qrbox p { margin:10px 0 0; font-size:14px; } .qrbox code { font-size:13px; }
  .qrbox .dim { color:#666; font-size:12px; }
  .pbox { width:100%; max-width:1100px; background:var(--card); border-radius:10px; padding:10px; }
  .phead { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .phead b { margin-right:auto; font-size:14px; }
  .phead button { font-size:13px; padding:5px 10px; min-width:0; background:#333; }
  .phead button.on { background:var(--live); }
  #pvideo { width:100%; max-height:75vh; background:#000; border-radius:6px; display:block; }
  #pmsg { min-height:1.3em; margin-top:6px; }
</style>
</head>
<body>
<h1>Studio Multicam <small id="ver"></small><span class="phonelinks"><button id="qrbtn" class="phonelink" title="Show a QR code to open the phone page on a phone">📱 Use a phone as a camera</button></span></h1>
<div class="controls">
  <button id="rec">● REC</button>
  <button id="stop">■ STOP</button>
  <button id="live">LIVE</button>
  <div id="rigbox"><div id="rig">…</div><div id="budget"></div></div>
</div>
<div id="msg"></div>
<div class="grid" id="cards"></div>
<section><h3>Ingest &amp; drive</h3>
  <div class="controls small"><button id="ingest">Ingest now</button><button id="eject">Eject drive</button></div>
  <div id="ingest-status">…</div>
  <div id="ingest-takes"></div>
</section>

<div id="qr" hidden><div class="qrbox">
  <div id="qrsvg"></div>
  <p><b>Scan with the phone's camera</b> to open the phone page</p>
  <p><code>http://studio-hub.local/phone</code></p>
  <p><a href="/phone" id="qrhere">Already on the phone? Open it here</a></p>
  <p class="dim">Android + Chrome only. First time on a phone: see the setup at the bottom of the phone page. Click outside to close.</p>
</div></div>
<div id="player" hidden>
  <div class="pbox">
    <div class="phead"><b id="ptitle"></b><span id="pcams"></span><button id="pclose">✕ Close</button></div>
    <video id="pvideo" controls playsinline preload="metadata"></video>
    <div id="pmsg" class="step"></div>
  </div>
</div>

<script src="qrcode.js"></script>
<script>
const $ = s => document.querySelector(s);
let snap = null, busy = false;

function fmt(v, unit, digits = 1) { return v == null ? "–" : (+v).toFixed(digits) + unit; }
function hms(s) { s = Math.floor(s); return [s / 3600 | 0, (s / 60 | 0) % 60, s % 60].map(x => String(x).padStart(2, "0")).join(":"); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function hubCard(h) {
  if (!h || h.temp_c == null) return "";
  const thr = h.throttled;
  const now = thr != null && (thr & 0xF), past = thr != null && (thr & 0xF0000);
  const hot = h.temp_c >= 75;
  const cls = now || hot ? "warn" : "ok";
  const thrTxt = thr == null ? "–" : now ? `<b class=bad>now (0x${thr.toString(16)})</b>` :
    past ? `<span style="color:var(--warn)">earlier (0x${thr.toString(16)})</span>` : "none";
  return `<div class="card ${cls}">
    <h2>studio-hub <span class="mode">hub</span></h2>
    <div class="kv">
      <span>temp</span><span class="${hot ? "bad" : ""}">${h.temp_c} °C <span class="step">(throttles at 80)</span></span>
      <span>fan</span><span>${h.fan_rpm == null ? "–" : h.fan_rpm ? h.fan_rpm + " rpm" : "off"}</span>
      <span>CPU</span><span>${h.cpu_mhz ?? "–"} MHz · load ${h.load ?? "–"}</span>
      <span>throttling</span><span>${thrTxt}</span>
      <span>SD free</span><span>${h.free_gb ?? "–"} GB</span>
    </div></div>`;
}
function card(name, n) {
  const st = n.status || {};
  const mode = n.online ? st.mode : "offline";
  if (!n.online) return `<div class="card off"><h2>${esc(name)} <span class="mode">offline</span></h2>
    <div class="step">Not reachable: powered off or not on Wi-Fi. REC records without it.</div></div>`;
  const cls = mode === "recording" ? "recording" : mode === "live" ? "live" : (n.problems.length || n.slow) ? "warn" : "ok";
  const sd = st.take && st.take.sync_difference_us;
  const dr = st.take ? (st.take.dropped_so_far || 0) : 0;
  const take = st.take ? `<span>take</span><span>${esc(st.take.take_id)} · ${hms(st.take.elapsed_s)} · ${st.take.frames ?? st.take.frames_est} fr</span>
    <span>dropped</span><span class="${dr ? "bad" : "good"}">${dr ? "<b>" + dr + " frames</b> (" + st.take.gaps_so_far + " gaps)" : "0"}</span>
    <span>sync Δ</span><span class="${sd != null && Math.abs(sd) > 1000 ? "bad" : ""}">${sd == null ? "–" : (sd / 1000).toFixed(3) + " ms"}</span>` : "";
  const url = `srt://${name}.local:8890?streamid=read:cam`;
  return `<div class="card ${cls}">
    <h2>${esc(name)} <span class="mode">${mode === "recording" ? '<span class="recdot"></span>REC' : esc(mode)}${st.take ? " · " + esc(st.take.role) : ""}</span></h2>
    <div class="kv">
      ${take}
      <span>temp</span><span>${fmt(st.temp_c, " °C")}</span>
      <span>free</span><span>${fmt(st.free_gb, " GB")} · ${fmt(st.free_hours, " h")}</span>
      <span>clock</span><span>${st.clock_synced ? "synced" : "<b class=bad>not synced</b>"} · ${fmt(st.clock_offset_ms, " ms", 3)}</span>
      <span>Wi-Fi</span><span>${fmt(st.wifi_dbm, " dBm", 0)} · PS ${st.wifi_powersave === false ? "off" : "<b class=bad>on</b>"}</span>
      ${st.last_error ? `<span>error</span><span class="bad">${esc(st.last_error)}</span>` : ""}
    </div>
    ${n.slow ? `<div class="problems">Slow to respond (Wi-Fi busy?); showing its last status.</div>` : ""}
    ${n.problems.length && mode !== "recording" ? `<div class="problems">${n.problems.map(esc).join("<br>")}</div>` : ""}
    <div class="url"><input readonly value="${url}"><button data-copy="${url}">copy</button>
      <a class="pv${mode === "live" ? "" : " off"}" href="http://${name}.local:8889/cam/" target="_blank" rel="noopener"
         title="${mode === "live" ? "Open live preview" : "Turn LIVE on to preview"}">preview</a></div>
  </div>`;
}

function phoneCard(id, p) {
  const st = p.status || {};
  const name = p.label || id;
  if (!p.online) return `<div class="card off"><h2>${esc(name)} <span class="mode">gone</span></h2>
    <div class="step">Page closed or phone off ${Math.round(p.age_s)} s ago. REC records without it.</div></div>`;
  const rec = st.state === "recording";
  const cls = rec ? "recording" : p.problems.length ? "warn" : "ok";
  const set = st.settings || {};
  const pic = st.locked ? `locked · ISO ${set.iso ?? "–"} · ${set.colorTemperature ?? "–"} K` : "<b style='color:var(--warn)'>not locked</b>";
  const mode = rec ? '<span class="recdot"></span>REC' : {ready: "ready", off: "camera off", finishing: "finishing", uploading: "uploading"}[st.state] || esc(st.state || "–");
  return `<div class="card ${cls}">
    <h2>${esc(name)} <span class="mode">${mode} · phone</span></h2>
    <div class="kv">
      <span>files</span><span>${esc(st.part || id)}.mov</span>
      ${st.take ? `<span>take</span><span>${esc(st.take)} · ${st.frames ?? 0} fr</span>
      <span>dropped</span><span class="${st.dropped ? "bad" : "good"}">${st.dropped ? "<b>" + st.dropped + " frames</b>" : "0"}</span>
      <span>upload</span><span>${st.uploaded ?? 0} pieces${st.queue ? ` · <b style="color:var(--warn)">${st.queue} waiting</b>` : " · up to date"}</span>` : ""}
      <span>picture</span><span>${pic}</span>
      <span>battery</span><span>${st.battery ?? "–"}%${st.charging ? " · charging" : st.charging === false ? " · <b class=bad>not charging</b>" : ""}</span>
      <span>clock</span><span>${st.rtt_ms != null ? "round trip " + st.rtt_ms + " ms" : "–"}</span>
      <span>model</span><span>${esc(st.model || "–")}</span>
    </div>
    ${p.problems.length && !rec ? `<div class="problems">${p.problems.map(esc).join("<br>")}</div>` : ""}
  </div>`;
}

function hm(s) { s = Math.max(0, Math.round(s / 60)); return s >= 60 ? `${s / 60 | 0} h ${s % 60} min` : `${s} min`; }
const LIMIT_NAMES = { hub: "hub SD card" };
function budgetTxt(b, state) {
  if (!b || b.total_s == null) return "";
  const by = LIMIT_NAMES[b.limited_by] || b.limited_by + " SD card";
  const who = `${b.cameras} camera${b.cameras === 1 ? "" : "s"}` + (b.phones ? ` + ${b.phones} phone${b.phones === 1 ? "" : "s"}` : "");
  if (state === "recording") return `${hm(b.remaining_s)} left · stops itself at ${hm(b.total_s)} (${by})`;
  return `≈ ${hm(b.total_s)} of recording space · ${who} · limit: ${by}`;
}
function render() {
  if (!snap) return;
  $("#ver").textContent = "hubd " + snap.hub_version;
  const rig = $("#rig");
  const live = Object.values(snap.nodes).some(n => n.status && n.status.mode === "live");
  let label = snap.state;
  if (snap.state === "recording" && snap.take) label = "● REC " + hms(Date.now() / 1000 - snap.take.recording_at);
  else if (snap.state === "idle" && live) label = "LIVE";
  rig.textContent = label.toUpperCase(); rig.className = snap.state;
  const bd = $("#budget");
  bd.textContent = budgetTxt(snap.budget, snap.state);
  bd.className = snap.budget && snap.budget.warn ? "warn" : "";
  bd.title = snap.budget && snap.budget.per ? Object.entries(snap.budget.per).map(([k, v]) => `${k}: ${hm(v)}`).join("\n") : "";
  $("#rec").disabled = busy || snap.state !== "idle";
  $("#stop").disabled = busy || snap.state !== "recording";
  $("#live").disabled = busy || snap.state !== "idle";
  $("#live").textContent = live ? "LIVE OFF" : "LIVE ON";
  $("#cards").innerHTML = hubCard(snap.hub) + Object.entries(snap.nodes).map(([k, n]) => card(k, n)).join("") +
    Object.entries(snap.phones || {}).map(([k, p]) => phoneCard(k, p)).join("");
  if (!busy && snap.message) msg(snap.message);
}

function msg(text, err) { const m = $("#msg"); m.textContent = text || ""; m.className = err ? "err" : ""; }

async function poll() {
  try { const r = await fetch("/api/status"); snap = await r.json(); render(); }
  catch (e) { msg("hub unreachable", true); }
}

async function act(path, body, label) {
  busy = true; render(); msg(label + "…");
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    const j = await r.json();
    if (!r.ok) msg((j.reasons || [j.error]).join("\n"), true);
    else if (j.errors && Object.keys(j.errors).length) msg(Object.entries(j.errors).map(([n, e]) => n + ": " + e).join("\n"), true);
    else msg("");
  } catch (e) { msg(String(e), true); }
  busy = false; poll();
}

$("#rec").onclick = () => act("/api/rec", {}, "Arming cameras");
$("#stop").onclick = () => act("/api/stop", {}, "Stopping");
$("#live").onclick = () => {
  const on = $("#live").textContent === "LIVE ON";
  act("/api/live", { on }, on ? "Starting live" : "Stopping live");
};
document.addEventListener("click", e => {
  const u = e.target.dataset && e.target.dataset.copy;
  if (u) navigator.clipboard.writeText(u).then(() => { e.target.textContent = "copied"; });
});
const STEPS = ["pulled", "checked", "conformed", "verified", "written", "marked"];
const STEP_NAMES = { pulled: "Pull", checked: "Check", conformed: "Convert",
  verified: "Verify", written: "Copy to drive", marked: "Mark on camera" };
function fmtEta(s) {
  if (s == null) return "";
  if (s < 60) return "under a minute";
  const m = Math.round(s / 60);
  return m < 60 ? `about ${m} min` : `about ${Math.floor(m / 60)} h ${m % 60} min`;
}
function fmtBytes(b) {
  return b >= 1e9 ? (b / 1e9).toFixed(1) + " GB" : Math.max(1, Math.round(b / 1e6)) + " MB";
}
function fmtDur(s) {
  s = Math.round(s || 0);
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
function camSteps(cs, paused) {
  const done = cs.done || [];
  const next = STEPS.find(x => !done.includes(x));
  return STEPS.map(step => {
    const name = STEP_NAMES[step];
    if (done.includes(step)) return `<span class="st done">✓ ${name}</span>`;
    if (cs.error && step === next) return `<span class="st err">✗ ${name}</span>`;
    if (cs.step === step) {
      const pct = cs.progress != null ? Math.round(cs.progress * 100) : null;
      return `<span class="st cur">${paused ? "⏸" : '<span class="spin"></span>'} ${name}` +
        (pct != null ? ` ${pct}% <span class="bar"><i style="width:${pct}%"></i></span>` : "") +
        (paused ? " · paused" : "") + "</span>";
    }
    return `<span class="st">○ ${name}</span>`;
  }).join("");
}
const isCam = c => c !== "recorded";       // Pi cameras (camN) and phones (their file ids)
function roughTxt(v) {          // stretches to avoid in an edit (dropped frames), from ingest
  const r = v && v.rough;
  if (!r || !r.length) return "";
  const secs = r.reduce((a, x) => a + (x.end_s - x.start_s), 0);
  const tip = r.map(x => `${fmtDur(x.start_s)}–${fmtDur(x.end_s)} (${x.missing} missing)`).join("\n");
  return ` <span style="color:var(--warn)" title="${esc(tip)}">· ${r.length} rough section${r.length > 1 ? "s" : ""}, ${secs < 60 ? secs.toFixed(1) + " s" : fmtDur(secs)}</span>`;
}
const labelOf = (t, c) => (t[c] && t[c].label) || (t.recorded && t.recorded.cameras && t.recorded.cameras[c] && t.recorded.cameras[c].label) || c;
const camsOf = t => Object.entries(t).filter(([c, v]) => isCam(c) && v && typeof v === "object");
// Nothing done or running yet: the take is still only on the cameras.
const notIngested = t => camsOf(t).every(([, v]) => !(v.done || []).length && !v.step && !v.error);
function takeStart(id) {            // take ids are local start times: YYYYMMDD-HHMMSS
  const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(id);
  if (!m) return "";
  const d = new Date(+m[1], m[2] - 1, +m[3]), today = new Date();
  const day = d.toDateString() === today.toDateString() ? "" :
    d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + " ";
  return `${day}${m[4]}:${m[5]}`;
}
function ingestView(st) {
  const paused = /^paused/.test(st.status || "");
  const running = (st.status || "") === "ingesting";
  const takes = Object.entries(st.takes || {});
  const total = takes.length;
  const doneN = takes.filter(([, t]) => t.complete ||
    (camsOf(t).length && camsOf(t).every(([, v]) => (v.done || []).includes("marked")))).length;
  const waitingN = takes.filter(([, t]) => notIngested(t)).length;
  const ejected = st.drive === "ejected" && /^no .* drive/.test(st.status || "");
  let s = ejected ? '<b class="good">Drive ejected: safe to unplug</b>' : `<b>${esc(st.status || "–")}</b>`;
  if (total) s += ` · ${doneN} of ${total} takes ingested` + (waitingN ? `, <b style="color:var(--warn)">${waitingN} only on the cameras</b>` : "");
  if ((running || paused) && st.eta_s != null) s += ` · ${fmtEta(st.eta_s)} left`;
  if (st.drive_free_gb != null) s += ` · drive ${st.drive_free_gb} GB free`;
  $("#ingest-status").innerHTML = s;

  const driveOk = !/^no .* drive|needs repair/.test(st.status || "") && st.drive !== "ejected";
  const playBtns = (id, cs) => {
    const ready = cs.filter(([, v]) => (v.done || []).includes("written")).map(([c]) => c);
    if (!ready.length) return "";
    return `<div class="plays">` + ready.map(c => `<button class="play" ${driveOk ? "" : "disabled title='STUDIO drive not in the hub'"}
      data-play="${esc(id)}" data-cam="${esc(c)}" data-cams="${esc(ready.join(","))}">▶ ${esc(labelOf(st.takes[id] || {}, c))}</button>`).join("") + "</div>";
  };
  const probs = rec => rec && rec.problems && rec.problems.length ?
    `<div class="camerr" style="margin-left:0">⚠ ${rec.problems.map(esc).join(" · ")}</div>` : "";
  $("#ingest-takes").innerHTML = takes.reverse().map(([id, cams]) => {
    const cs = camsOf(cams);
    const rec = cams.recorded;
    const L = c => esc(labelOf(cams, c));
    if (notIngested(cams)) {
      // Recorded, not ingested yet: what was done in the session, at a glance.
      const rc = rec ? Object.entries(rec.cameras) : cs.map(([c, v]) => [c, { frames: v.frames_cam, dropped: v.dropped }]);
      const len = rec ? rec.length_s : Math.max(0, ...cs.map(([, v]) => v.duration_s || 0));
      const drops = rc.reduce((a, [, v]) => a + (v.dropped || 0), 0);
      const label = cs.length && (running || paused) ? "queued for ingest" : "on cameras · not ingested yet";
      return `<div class="take waiting"><h4><span>${esc(id)} <small>${[takeStart(id), len ? fmtDur(len) : "",
        rc.length + (rc.length === 1 ? " camera" : " cameras")].filter(Boolean).join(" · ")}</small></span>
        <span style="color:var(--warn)">${label}</span></h4>
        <div class="camdone">${rc.map(([c, v]) => `${esc(v.label || c)}${v.uploading ? ": uploading…" : v.frames != null ? ": " + v.frames + " frames" : ""}` +
          (v.dropped ? ` <span class="bad">(${v.dropped} dropped)</span>` : "") + roughTxt(cams[c])).join(" · ")}` +
        (drops ? "" : ` · <span class="good">no dropped frames</span>`) + `</div>${probs(rec)}</div>`;
    }
    const allDone = cs.length && cs.every(([, v]) => (v.done || []).includes("marked"));
    const active = cs.some(([, v]) => v.step);
    const err = cs.some(([, v]) => v.error);
    const dur = Math.max(rec ? rec.length_s : 0, ...cs.map(([, v]) => v.duration_s || 0));
    const etas = cs.map(([, v]) => v.eta_s).filter(x => x != null);
    // Size: what's on the drive once written, otherwise what will be pulled from the cameras.
    const onDrive = cs.reduce((a, [, v]) => a + (v.mov_bytes || 0), 0);
    const toPull = cs.reduce((a, [, v]) => a + ((v.done || []).includes("written") ? 0 : (v.src_bytes || 0)), 0);
    const size = [onDrive ? fmtBytes(onDrive) + " on drive" : "", toPull ? fmtBytes(toPull) + " from cameras" : ""]
      .filter(Boolean).join(" + ");
    let head = `${esc(id)} <small>${[takeStart(id), dur ? fmtDur(dur) + " of video" : "", size].filter(Boolean).join(" · ")}</small>`;
    let right = allDone ? '<span class="good">✓ done</span>' : err ? '<span class="bad">needs attention</span>' :
      active ? `<span>${etas.length ? fmtEta(Math.max(...etas)) + " left" : "working"}</span>` : '<small>queued</small>';
    let body;
    if (allDone) {
      body = `<div class="camdone">` + cs.map(([c, v]) => `${L(c)}: ${v.frames_out != null ? v.frames_out + " frames" : "done"}` +
        (v.repeated > 0 ? ` (${v.repeated} repeated)` : v.repeated < 0 ? ` (${-v.repeated} skipped to fit 30 fps)` : "") + (v.dropped ? `, ${v.dropped} dropped on camera` : "") + roughTxt(v)).join(" · ") + "</div>";
    } else {
      body = cs.map(([c, v]) => `<div class="camrow"><span class="camname" title="${L(c)}">${L(c)}</span><div class="steps">${camSteps(v, paused)}${roughTxt(v) ? `<span class="st">${roughTxt(v)}</span>` : ""}</div></div>` +
        (v.error ? `<div class="camerr">${esc(v.error)}</div>` : "")).join("");
    }
    const cls = allDone ? "done" : err ? "error" : active ? "active" : "";
    return `<div class="take ${cls}"><h4><span>${head}</span>${right}</h4>${body}${probs(rec)}${playBtns(id, cs)}</div>`;
  }).join("");
}
// ---- playback straight from the STUDIO drive (hub-ingest mounts it read-only on request)
const pv = $("#pvideo");
function openPlayer(take, cam, cams) {
  const t = pv.currentTime && $("#player").hidden === false ? pv.currentTime : 0;
  $("#player").hidden = false;
  $("#ptitle").textContent = take;
  $("#pcams").innerHTML = cams.map(c => `<button class="${c === cam ? "on" : ""}" data-pcam="${esc(c)}">${esc(c)}</button>`).join(" ");
  $("#pmsg").textContent = "Opening the drive…";
  $("#player").dataset.take = take; $("#player").dataset.cams = cams.join(",");
  pv.src = `/media/${encodeURIComponent(take)}/${encodeURIComponent(cam)}.mov`;
  pv.onloadedmetadata = () => { if (t) pv.currentTime = Math.min(t, pv.duration || t); $("#pmsg").textContent = ""; pv.play().catch(() => {}); };
  pv.onerror = () => { $("#pmsg").textContent = "Can't play this file: the STUDIO drive may be unplugged or busy."; };
}
function closePlayer() { pv.pause(); pv.removeAttribute("src"); pv.load(); $("#player").hidden = true; }
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button");
  if (!b) return;
  if (b.dataset.play) openPlayer(b.dataset.play, b.dataset.cam, b.dataset.cams.split(","));
  else if (b.dataset.pcam) openPlayer($("#player").dataset.take, b.dataset.pcam, $("#player").dataset.cams.split(","));
});
$("#pclose").onclick = closePlayer;
// QR code for the phone page: the fixed hub name, so it matches the Chrome flag set on each phone (docs/runbook.md).
const PHONE_URL = "http://studio-hub.local/phone";
$("#qrbtn").onclick = () => {
  if (!$("#qrsvg").innerHTML) {
    try { const q = qrcode(0, "M"); q.addData(PHONE_URL); q.make(); $("#qrsvg").innerHTML = q.createSvgTag({ cellSize: 6, margin: 4, scalable: true }); }
    catch (e) { $("#qrsvg").textContent = "QR code unavailable: " + e.message; }
  }
  $("#qr").hidden = false;
};
$("#qr").onclick = e => { if (e.target.id !== "qrhere") $("#qr").hidden = true; };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#qr").hidden = true; });
$("#player").onclick = e => { if (e.target.id === "player") closePlayer(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#player").hidden) closePlayer(); });
async function pollIngest() {
  try { const r = await fetch("/api/ingest"); ingestView(await r.json()); } catch (e) {}
}
$("#ingest").onclick = () => act("/api/ingest/start", {}, "Queued ingest").then(pollIngest);
$("#eject").onclick = () => act("/api/drive/eject", {}, "Ejecting drive").then(pollIngest);
poll(); setInterval(poll, 1000);
pollIngest(); setInterval(pollIngest, 3000);
</script>
