<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Snapshots</title>
<style>
  :root { --bg:#111; --card:#1c1c1e; --fg:#eee; --dim:#888; --ok:#3c3; --warn:#e90; --bad:#e33; --live:#27e; --rec:#d22; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 a { font-size:14px; color:var(--dim); font-weight:normal; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  button { font:inherit; font-weight:600; padding:8px 14px; border:0; border-radius:8px; color:#fff; background:#333; cursor:pointer; }
  button.main { background:var(--live); }
  button:disabled { opacity:.35; cursor:default; }
  label { color:var(--dim); font-size:14px; }
  #msg { min-height:1.4em; color:var(--warn); margin-bottom:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap:12px; }
  .card { background:var(--card); border-radius:10px; padding:10px 12px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px; }
  .head b { font-size:16px; } .mode { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  .mode.live { color:var(--live); }
  .pic { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:6px; overflow:hidden; }
  .pic img { width:100%; height:100%; object-fit:contain; display:block; }
  .pic .box { position:absolute; left:33.33%; top:33.33%; width:33.33%; height:33.33%; border:1px dashed rgba(255,255,255,.5); pointer-events:none; }
  .pic .none { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:14px; text-align:center; padding:12px; }
  .meta { font-size:12px; color:var(--dim); margin-top:4px; min-height:1.3em; }
  .focus { margin-top:8px; display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:10px; align-items:start; }
  .focus canvas { width:100%; aspect-ratio:16/9; background:#000; border-radius:6px; image-rendering:pixelated; }
  .fctl { display:flex; flex-direction:column; gap:6px; min-width:150px; }
  .fctl .row { display:flex; gap:6px; } .fctl .row button { flex:1; padding:6px 0; }
  .num { font:600 22px/1 ui-monospace, monospace; } .sub { font-size:12px; color:var(--dim); }
  .sharp.best { color:var(--ok); }
  .err { color:var(--bad); }
</style>
</head>
<body>
<h1>Snapshots <a href="/">← hub page</a></h1>
<div class="bar">
  <button id="refresh" class="main">Refresh all</button>
  <label><input type="checkbox" id="auto"> refresh every 5 s</label>
  <span id="rig" class="sub"></span>
</div>
<div id="msg"></div>
<div class="grid" id="grid"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let snap = null;            // /api/status
const F = {};               // per camera: {lens (being tried), best: {lens, sharp}, busy, url}
const LENS_HINT = "0 = far away, 0.5 ≈ 2 m, 1 ≈ 1 m";

function idle() { return snap && snap.state === "idle"; }
function saved(cam) { return ((snap.camera_settings || {})[cam] || {}).lens_position; }

function cardHtml(id, title, mode, focus) {
  return `<div class="card" id="c-${id}">
    <div class="head"><b>${esc(title)}</b><span class="mode" id="m-${id}">${esc(mode)}</span></div>
    <div class="pic"><img id="i-${id}" alt=""><div class="box"></div><div class="none" id="n-${id}">no picture yet</div></div>
    <div class="meta" id="t-${id}"></div>
    ${focus ? `<div class="focus">
      <canvas id="z-${id}" width="640" height="360" title="the middle of the picture at full resolution"></canvas>
      <div class="fctl">
        <div><span class="sub">sharpness</span><br><span class="num sharp" id="s-${id}">–</span></div>
        <div><span class="sub">focus (lens position)</span><br><span class="num" id="l-${id}">–</span>
          <div class="sub" id="ls-${id}"></div></div>
        <div class="row"><button data-cam="${id}" data-d="-0.1">−0.1</button><button data-cam="${id}" data-d="0.1">+0.1</button></div>
        <div class="row"><button data-cam="${id}" data-d="-0.02">−.02</button><button data-cam="${id}" data-d="0.02">+.02</button></div>
        <button data-cam="${id}" data-act="find" title="tries focus positions and picks the sharpest middle">Find sharpest</button>
        <button data-cam="${id}" data-act="save">Save focus</button>
      </div></div>` : ""}
  </div>`;
}

function layout() {
  const cams = Object.keys(snap.nodes), phones = Object.entries(snap.phones || {}).filter(([, p]) => p.online);
  const want = cams.map(c => "c-" + c).concat(phones.map(([k]) => "c-p-" + k)).join(",");
  if ($("#grid").dataset.ids !== want) {
    $("#grid").innerHTML = cams.map(c => cardHtml(c, c, "", true)).join("") +
      phones.map(([k, p]) => cardHtml("p-" + k, p.label || k, "phone", false)).join("");
    $("#grid").dataset.ids = want;
  }
  for (const c of cams) {
    const n = snap.nodes[c], m = !n.online ? "offline" : (n.status || {}).mode || "?";
    const el = $("#m-" + c); el.textContent = m; el.className = "mode" + (m.startsWith("live") ? " live" : "");
    F[c] = F[c] || {};
    if (F[c].lens == null) F[c].lens = saved(c) ?? null;
    $("#l-" + c).textContent = F[c].lens == null ? "camera default" : F[c].lens.toFixed(2);
    const sv = saved(c);
    $("#ls-" + c).textContent = (sv == null ? "nothing saved yet" : `saved: ${sv.toFixed(2)}`) +
      (F[c].lens != null && sv !== F[c].lens ? " · not saved" : "") + " · " + LENS_HINT;
  }
  $("#rig").textContent = idle() ? "" : `Rig is ${snap.state}: snapshots pause during a take.`;
  document.querySelectorAll("button").forEach(b => { if (b.dataset.cam || b.id === "refresh") b.disabled = !idle() || (b.dataset.cam && F[b.dataset.cam] && (F[b.dataset.cam].busy || F[b.dataset.cam].sweeping)); });
}

async function status() {
  try { snap = await (await fetch("/api/status" + (document.hidden ? "" : "?watch=1"))).json(); layout(); }
  catch (e) { $("#msg").textContent = "Hub not reachable: " + e.message; }
}

function show(id, blob, info) {
  const url = URL.createObjectURL(blob), img = $("#i-" + id), old = img.src;
  img.onload = () => { if (old.startsWith("blob:")) URL.revokeObjectURL(old); zoom(id, img); };
  img.src = url; $("#n-" + id).hidden = true;
  return info;
}
function zoom(id, img) {
  const z = $("#z-" + id); if (!z) return;
  const w = img.naturalWidth, h = img.naturalHeight, g = z.getContext("2d");
  g.imageSmoothingEnabled = false;      // middle 640x360 at full resolution (1:1 on a 1080p still)
  g.drawImage(img, (w - 640) / 2, (h - 360) / 2, 640, 360, 0, 0, 640, 360);
}

async function shoot(cam, lens) {
  const q = lens == null ? "" : "?lens=" + lens.toFixed(3);
  const r = await fetch(`/api/snap/${cam}.jpg${q}`);
  if (!r.ok) throw new Error((await r.json()).error || r.status);
  const info = JSON.parse(r.headers.get("X-Snap-Info") || "{}");
  show(cam, await r.blob(), info);
  const s = info.sharpness, best = F[cam].best;
  $("#s-" + cam).textContent = s == null ? "–" : Math.round(s);
  $("#s-" + cam).className = "num sharp" + (best && s >= best.sharp ? " best" : "");
  $("#t-" + cam).textContent = `${info.source === "live" ? "from the live stream" : "still"} · ${(info.ms / 1000).toFixed(1)} s · ${new Date().toLocaleTimeString()}`;
  return info;
}

async function one(cam, lens) {
  F[cam].busy = true; layout();
  try { return await shoot(cam, lens); }
  catch (e) { $("#t-" + cam).innerHTML = `<span class="err">${esc(e.message)}</span>`; }
  finally { F[cam].busy = false; layout(); }
}

async function refreshAll() {
  if (!idle()) return;
  fetch("/api/snap/phones", {method: "POST"}).catch(() => {});
  const cams = Object.keys(snap.nodes).filter(c => snap.nodes[c].online && !F[c].busy && !F[c].sweeping);
  await Promise.all(cams.map(c => one(c, F[c].lens)));
  setTimeout(loadPhones, 1500);       // phones send theirs on their next poll (~1 s)
}
async function loadPhones() {
  for (const [k, p] of Object.entries(snap.phones || {})) {
    if (!p.online || !$("#i-p-" + k)) continue;
    const r = await fetch(`/api/snap/phone/${encodeURIComponent(k)}.jpg`);
    if (!r.ok) continue;
    const info = JSON.parse(r.headers.get("X-Snap-Info") || "{}");
    show("p-" + k, await r.blob());
    $("#t-p-" + k).textContent = `${(p.status || {}).locked ? "settings locked" : "not locked"} · picture ${info.age_s} s old`;
  }
}

async function nudge(cam, d) {
  const base = F[cam].lens ?? saved(cam) ?? 1.0;
  F[cam].lens = Math.max(0, Math.min(15, +(base + d).toFixed(3)));
  layout();
  const i = await one(cam, F[cam].lens);
  if (i && i.sharpness != null && (!F[cam].best || i.sharpness > F[cam].best.sharp)) F[cam].best = {lens: F[cam].lens, sharp: i.sharpness};
}

async function findSharpest(cam) {
  // Coarse sweep over the useful range (infinity to ~0.5 m), then refine around the best.
  F[cam].best = null;
  const tryAt = async l => { F[cam].lens = +l.toFixed(3); layout(); const i = await one(cam, F[cam].lens);
    if (i && i.sharpness != null && (!F[cam].best || i.sharpness > F[cam].best.sharp)) F[cam].best = {lens: F[cam].lens, sharp: i.sharpness}; };
  for (let l = 0; l <= 2.0001; l += 0.25) { if (!idle()) return; await tryAt(l); }
  const c = F[cam].best ? F[cam].best.lens : 1.0;
  for (const d of [-0.15, -0.1, -0.05, 0.05, 0.1, 0.15]) { if (!idle()) return; if (c + d >= 0) await tryAt(c + d); }
  F[cam].lens = F[cam].best.lens; layout();
  await one(cam, F[cam].lens);
  $("#msg").textContent = `${cam}: sharpest at ${F[cam].lens.toFixed(2)}. Tap Save focus to keep it.`;
}

async function save(cam) {
  if (F[cam].lens == null) return;
  const r = await fetch(`/api/camera/${cam}/settings`, {method: "POST", body: JSON.stringify({lens_position: F[cam].lens})});
  const j = await r.json();
  if (!r.ok) { $("#msg").textContent = j.error; return; }
  snap.camera_settings = j; layout();
  $("#msg").textContent = `${cam}: focus ${F[cam].lens.toFixed(2)} saved; used for every take from now on.`;
}

$("#grid").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || !b.dataset.cam) return;
  const cam = b.dataset.cam; $("#msg").textContent = "";
  if (b.dataset.d) nudge(cam, +b.dataset.d);
  else if (b.dataset.act === "find") { F[cam].sweeping = true; findSharpest(cam).finally(() => { F[cam].sweeping = false; layout(); }); }
  else if (b.dataset.act === "save") save(cam);
});
$("#refresh").onclick = refreshAll;
let timer = null;
$("#auto").onchange = e => { clearInterval(timer); timer = e.target.checked ? setInterval(() => { if (!document.hidden) refreshAll(); }, 5000) : null; };

status().then(refreshAll);
setInterval(status, 2000);
</script>
</body>
</html>
