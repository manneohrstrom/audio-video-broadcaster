# /etc/chrony/conf.d/studio-hub.conf on studio-hub
# Upstream: the Debian pool from the stock /etc/chrony/chrony.conf.
# Serve time to the camera nodes on the LAN.
allow 192.168.68.0/22
# Keep serving the nodes (at a high stratum) if the internet is down,
# so the cameras still agree with each other.
local stratum 10
