<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone camera</title>
<style>
  :root { --bg:#111; --fg:#eee; --mut:#999; --card:#1c1c1c; --red:#e33; --amb:#e90; --grn:#3b5; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  header { display:flex; gap:8px; align-items:center; padding:8px 12px; background:var(--card); }
  header .st { margin-left:auto; font-weight:700; padding:4px 10px; border-radius:6px; background:#333; }
  .st.rec { background:var(--red); } .st.up { background:var(--amb); color:#000; } .st.ready { background:var(--grn); color:#000; }
  video { width:100%; max-height:45vh; background:#000; display:block; }
  section { padding:8px 12px; }
  button { font:inherit; padding:8px 12px; border-radius:6px; border:0; background:#333; color:var(--fg); }
  button.big { font-size:18px; padding:12px 18px; }
  button.rec { background:var(--red); }
  input { font:inherit; width:6.5em; background:#222; color:var(--fg); border:1px solid #444; border-radius:4px; padding:4px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
  .grid { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-variant-numeric:tabular-nums; }
  .mut { color:var(--mut); } .warn { color:var(--amb); } .bad { color:var(--red); }
  pre { white-space:pre-wrap; word-break:break-all; font-size:11px; background:#000; padding:6px; max-height:30vh; overflow:auto; }
  details summary { cursor:pointer; color:var(--mut); }
</style>
</head>
<body>
<header>
  <input id="name" placeholder="phone1" style="width:5em">
  <button id="connect">Start camera</button>
  <span id="state" class="st">off</span>
</header>
<video id="preview" muted playsinline autoplay></video>
<section>
  <div class="row">
    <button id="rec" class="big rec">REC</button>
    <button id="stop" class="big">STOP</button>
    <label><input type="checkbox" id="live" checked style="width:auto"> upload while recording</label>
  </div>
  <div class="grid" id="stats"></div>
  <div id="msg" class="warn"></div>
</section>
<section>
  <b>Locks</b> <span class="mut">(exposure in 100 µs units: 200 = 1/50 s)</span>
  <div class="row">
    <label>exp <input id="exposureTime" type="number" value="200"></label>
    <label>ISO <input id="iso" type="number"></label>
    <label>WB K <input id="colorTemperature" type="number"></label>
    <label>focus <input id="focusDistance" type="number" step="0.01"></label>
  </div>
  <div class="row">
    <button id="lock">Lock these</button>
    <button id="autolock">Auto, then lock</button>
    <button id="auto">All auto</button>
  </div>
  <details><summary>capabilities / settings</summary><pre id="caps"></pre></details>
  <div class="row"><button id="pending">Upload leftovers</button><span id="pendingmsg" class="mut"></span></div>
  <div class="row"><b>Send a file to the hub</b> <span class="mut">(e.g. a Google Camera clip for comparison)</span></div>
  <div class="row"><input type="file" id="file" accept="video/*" style="width:auto"><button id="send">Send</button><span id="sendmsg" class="mut"></span></div>
</section>
<script>
"use strict";
const $ = id => document.getElementById(id);
const S = {
  name: localStorage.getItem("phone_name") || "", stream: null, track: null,
  state: "off", take: null, seq: 0, buf: [], bufFrames: [], frames: 0, dropped: 0, encoded: 0,
  pendingMeta: new Map(), encoder: null, encCfg: null, reader: null, clock: [], doneCmd: null,
  queue: [], uploaded: 0, bytesUp: 0, uploading: false, chunkDir: null, battery: null,
  lastErr: "", hidden: 0, wake: null, opfs: null, lastArr: null, maxGapMs: 0,
};
$("name").value = S.name;

function msg(t) { $("msg").textContent = t; if (t) hublog({ev: "msg", t}); }
function setState(s) { S.state = s; const e = $("state"); e.textContent = s;
  e.className = "st " + ({recording:"rec", uploading:"up", ready:"ready", finishing:"up"}[s] || ""); }

async function hublog(o) {
  if (!S.name) return;
  try { await fetch("/api/log/" + S.name, {method:"POST", body: JSON.stringify(Object.assign({perf_ms: performance.now(), take: S.take}, o))}); } catch (e) {}
}

// ---------- clock: page performance.now() -> hub wall clock
async function ping() {
  const t0 = performance.now();
  const r = await fetch("/api/time", {cache: "no-store"});
  const j = await r.json();
  const t1 = performance.now();
  return {perf_ms: (t0 + t1) / 2, hub_ns: j.hub_ns, rtt_ms: t1 - t0};
}
async function pingBurst(n = 5) {
  const out = [];
  for (let i = 0; i < n; i++) { try { out.push(await ping()); } catch (e) {} }
  out.sort((a, b) => a.rtt_ms - b.rtt_ms);
  if (out.length) S.clock.push(...out.slice(0, 2));
  return out[0];
}
function offsetMs() {    // hub - page, from the best recent sample
  const rec = S.clock.slice(-10); if (!rec.length) return null;
  const b = rec.reduce((a, c) => c.rtt_ms < a.rtt_ms ? c : a);
  return {off: b.hub_ns / 1e6 - b.perf_ms, rtt: b.rtt_ms};
}

// ---------- camera
async function startCamera() {
  S.name = $("name").value.trim() || "phone1";
  if (!/^phone\d{1,2}$/.test(S.name)) { msg("Name must be phone1, phone2, …"); return; }
  localStorage.setItem("phone_name", S.name); $("name").value = S.name;
  try { await document.documentElement.requestFullscreen(); await screen.orientation.lock("landscape"); }
  catch (e) { hublog({ev: "orientation_lock_failed", err: String(e)}); }
  if (!window.isSecureContext) { msg("Not a secure context: add this address in chrome://flags/#unsafely-treat-insecure-origin-as-secure"); return; }
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {
      facingMode: {ideal: "environment"}, width: {ideal: 1920}, height: {ideal: 1080}, frameRate: {ideal: 30, max: 30}}});
  } catch (e) { msg("Camera: " + e.name + " " + e.message); return; }
  S.track = S.stream.getVideoTracks()[0];
  $("preview").srcObject = S.stream;
  setState("ready"); msg("");
  const ts = S.track.getSettings();
  if (ts.height > ts.width) msg("Video is portrait (" + ts.width + "×" + ts.height + "): turn the phone sideways and tap Start camera again");
  showCaps(true);
  wakeLock();
  if (navigator.getBattery) { try { S.battery = await navigator.getBattery(); } catch (e) {} }
  try { S.opfs = await navigator.storage.getDirectory(); } catch (e) { S.opfs = null; }
  hublog({ev: "support", opfs: !!S.opfs, writable: !!(window.FileSystemFileHandle && FileSystemFileHandle.prototype.createWritable),
          mstp: "MediaStreamTrackProcessor" in window, venc: "VideoEncoder" in window, ua: navigator.userAgent});
  listLeftovers();
}
function showCaps(log) {
  const caps = S.track.getCapabilities ? S.track.getCapabilities() : {};
  const set = S.track.getSettings();
  $("caps").textContent = "SETTINGS " + JSON.stringify(set, null, 1) + "\nCAPABILITIES " + JSON.stringify(caps, null, 1);

  if (log) hublog({ev: "caps", caps, settings: set});
  return {caps, set};
}
async function apply(c, label) {
  try { await S.track.applyConstraints({advanced: [c]}); }
  catch (e) { msg(label + ": " + e.name + " " + e.message); hublog({ev: "apply_fail", c, err: String(e)}); return false; }
  await new Promise(r => setTimeout(r, 500));
  const {set} = showCaps(false);
  hublog({ev: "applied", label, c, settings: set});
  return true;
}
function num(id) { const v = parseFloat($(id).value); return isNaN(v) ? undefined : v; }
async function lockThese() {
  const caps = S.track.getCapabilities ? S.track.getCapabilities() : {};
  const results = [];
  const tryOne = async (label, c) => results.push(label + (await apply(c, label) ? " ok" : " FAILED"));
  if (caps.exposureMode) await tryOne("exposure", Object.assign({exposureMode: "manual", exposureTime: num("exposureTime")}, num("iso") ? {iso: num("iso")} : {}));
  else results.push("exposure: not offered");
  if (caps.whiteBalanceMode) await tryOne("wb", {whiteBalanceMode: "manual", colorTemperature: num("colorTemperature") || 4500});
  else results.push("wb: not offered");
  if (caps.focusMode) await tryOne("focus", Object.assign({focusMode: "manual"}, num("focusDistance") !== undefined ? {focusDistance: num("focusDistance")} : {}));
  else results.push("focus: not offered");
  msg(results.join(" · "));
}
async function allAuto() {
  const caps = S.track.getCapabilities ? S.track.getCapabilities() : {};
  const c = {};
  if (caps.exposureMode) c.exposureMode = "continuous";
  if (caps.whiteBalanceMode) c.whiteBalanceMode = "continuous";
  if (caps.focusMode) c.focusMode = "continuous";
  await apply(c, "auto");
}
// Measure the picture itself: Chrome doesn't report the live auto ISO, WB or focus.
const cv = document.createElement("canvas");
function grab(w = 160, h = 90, crop = 1) {
  const v = $("preview"); if (!v.videoWidth) return null;
  cv.width = w; cv.height = h;
  const g = cv.getContext("2d", {willReadFrequently: true});
  const sw = v.videoWidth * crop, sh = v.videoHeight * crop;
  g.drawImage(v, (v.videoWidth - sw) / 2, (v.videoHeight - sh) / 2, sw, sh, 0, 0, w, h);
  return g.getImageData(0, 0, w, h).data;
}
function stats() {    // mean luma (0-255) and R/B ratio
  const d = grab(); if (!d) return null;
  let r = 0, gg = 0, b = 0; const n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
  return {y: (0.299 * r + 0.587 * gg + 0.114 * b) / n, rb: (r + 1) / (b + 1)};
}
function sharpness() {   // variance of the Laplacian, centre crop at about 1:1
  const w = 320, h = 180, d = grab(w, h, 1 / 6); if (!d) return 0;
  const Y = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) Y[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2];
  let s = 0, s2 = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x, L = 4 * Y[i] - Y[i - 1] - Y[i + 1] - Y[i - w] - Y[i + w];
    s += L; s2 += L * L; n++;
  }
  return s2 / n - (s / n) ** 2;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function settle(ms = 600) { await wait(ms); }
async function avgStats(k = 3) { let y = 0, rb = 0; for (let i = 0; i < k; i++) { const s = stats(); y += s.y; rb += s.rb; await wait(100); } return {y: y / k, rb: rb / k}; }
async function setC(c) { try { await S.track.applyConstraints({advanced: [c]}); return true; } catch (e) { hublog({ev: "apply_fail", c, err: String(e)}); return false; } }
const clamp = (v, r) => Math.min(r.max, Math.max(r.min, v));

async function autoThenLock() {
  const caps = S.track.getCapabilities();
  await allAuto();
  msg("auto for 3 s …"); await wait(3000);
  const target = await avgStats(5);
  const autoSet = S.track.getSettings();
  const log = {target, autoSet: {exposureTime: autoSet.exposureTime, iso: autoSet.iso}, steps: []};

  // 1. exposure: shutter at the chosen value, ISO bisected (log scale) to match auto's brightness
  const exp = num("exposureTime") || 200;
  let lo = caps.iso.min, hi = caps.iso.max, iso = 400, bestIso = null, bestErr = 1e9;
  for (let i = 0; i < 9; i++) {
    iso = Math.round(Math.sqrt(lo * hi));
    await setC({exposureMode: "manual", exposureTime: exp, iso}); await settle(900);
    const st = await avgStats(); log.steps.push({iso, y: +st.y.toFixed(1)});
    msg(`matching brightness: ISO ${iso}, ${st.y.toFixed(0)} vs ${target.y.toFixed(0)}`);
    const err = Math.abs(st.y - target.y);
    if (err < bestErr) { bestErr = err; bestIso = iso; }
    if (err < 0.03 * target.y || hi / lo < 1.08) break;
    if (st.y < target.y) lo = iso; else hi = iso;
  }
  iso = bestIso;
  await setC({exposureMode: "manual", exposureTime: exp, iso}); await settle(600);
  $("iso").value = iso;
  if (iso >= caps.iso.max * 0.9) log.warn = "ISO near max: the room is too dark for 1/50 s";

  // 2. white balance: Chrome maps Kelvin to the camera's AWB presets; try each, keep the closest to auto's colour
  if (caps.colorTemperature) {
    const r = caps.colorTemperature; let bestK = null, bestD = 1e9;
    for (const k of [2850, 3000, 3500, 4000, 4500, 5000, 5500, 6000, 6500, 7000].filter(k => k >= r.min && k <= r.max)) {
      await setC({whiteBalanceMode: "manual", colorTemperature: k}); await settle(600);
      const st = await avgStats(2); log.steps.push({k, rb: +st.rb.toFixed(3)});
      msg(`matching colour: ${k} K, R/B ${st.rb.toFixed(2)} vs ${target.rb.toFixed(2)}`);
      const d = Math.abs(Math.log(st.rb / target.rb));
      if (d < bestD) { bestD = d; bestK = k; }
    }
    await setC({whiteBalanceMode: "manual", colorTemperature: bestK}); await settle(500);
    $("colorTemperature").value = bestK;
  }

  // 3. focus: contrast sweep over the lens range, then refine around the best
  if (caps.focusDistance) {
    const r = caps.focusDistance, best = {d: null, s: -1};
    const tryD = async d => { d = +clamp(d, r).toFixed(2); await setC({focusMode: "manual", focusDistance: d}); await settle(350);
      const s = (sharpness() + sharpness()) / 2; log.steps.push({focus: d, s: Math.round(s)}); if (s > best.s) { best.s = s; best.d = d; } };
    for (let i = 0; i <= 12; i++) { const d = r.min * Math.pow(r.max / r.min, i / 12); msg(`focus sweep ${d.toFixed(2)} m`); await tryD(d); }
    const f = Math.pow(r.max / r.min, 1 / 12);
    for (const m of [1 / f, 1 / Math.sqrt(f), Math.sqrt(f), f]) await tryD(best.d * m);
    await setC({focusMode: "manual", focusDistance: best.d}); await settle(400);
    log.focus = {best: best.d, sharpness: Math.round(sharpness())};
    $("focusDistance").value = best.d;
  }
  const end = await avgStats();
  const {set} = showCaps(false);
  hublog({ev: "autolock", log, end, settings: set});
  msg(`Locked: 1/${Math.round(10000 / exp)} s, ISO ${Math.round(iso)}, ${$("colorTemperature").value} K, focus ${$("focusDistance").value} m · brightness ${end.y.toFixed(0)} (auto ${target.y.toFixed(0)}), R/B ${end.rb.toFixed(2)} (auto ${target.rb.toFixed(2)})` +
      (log.warn ? " · WARNING: " + log.warn : ""));
}

// ---------- wake lock
async function wakeLock() {
  try { if ("wakeLock" in navigator) S.wake = await navigator.wakeLock.request("screen"); } catch (e) { msg("Wake lock: " + e.message); }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") wakeLock();
  else if (S.state === "recording") { S.hidden++; hublog({ev: "hidden_during_take"}); }
});

// ---------- recording
async function pickEncoder(w, h) {
  for (const codec of ["avc1.640028", "avc1.4d0028", "avc1.42e028"]) {
    for (const hw of ["prefer-hardware", "no-preference"]) {
      const cfg = {codec, width: w, height: h, bitrate: 16e6, framerate: 30, hardwareAcceleration: hw,
                   latencyMode: "quality", avc: {format: "annexb"}};
      try { const s = await VideoEncoder.isConfigSupported(cfg); if (s.supported) return s.config || cfg; } catch (e) {}
    }
  }
  return null;
}
async function startRec(takeId) {
  if (S.state === "recording") return;
  if (!S.track) { msg("Start the camera first"); return; }
  if (!("MediaStreamTrackProcessor" in window) || !("VideoEncoder" in window)) { msg("This Chrome lacks WebCodecs capture"); return; }
  S.take = takeId || new Date().toISOString().replace(/[-:]/g, "").replace("T", "-").slice(0, 15);
  Object.assign(S, {seq: 0, buf: [], bufFrames: [], frames: 0, dropped: 0, encoded: 0, uploaded: 0, bytesUp: 0,
                    clock: [], hidden: 0, maxGapMs: 0, lastArr: null, queue: []});
  S.pendingMeta.clear();
  setState("recording");
  await pingBurst(8);
  // configure the encoder before reading frames: doing it on the first frame stalls capture ~230 ms
  const ts = S.track.getSettings();
  S.encCfg = await pickEncoder(ts.width, ts.height);
  if (!S.encCfg) { msg("no H.264 encoder"); setState("ready"); return; }
  S.encoder = new VideoEncoder({output: onChunk, error: e => { msg("encoder: " + e.message); hublog({ev: "enc_err", err: String(e)}); }});
  S.encoder.configure(S.encCfg);
  S.encLogged = false;
  S.chunkDir = null;
  if (S.opfs) { try { S.chunkDir = await S.opfs.getDirectoryHandle(S.take + "_" + S.name, {create: true}); } catch (e) { S.chunkDir = null; } }
  const proc = new MediaStreamTrackProcessor({track: S.track.clone()});
  S.reader = proc.readable.getReader();
  S.recStart = performance.now();
  S.settingsAtRec = S.track.getSettings();
  hublog({ev: "rec", settings: S.settingsAtRec, opfs: !!S.chunkDir});
  readLoop().catch(e => { msg("capture: " + e.message); hublog({ev: "capture_err", err: String(e)}); });
}
async function readLoop() {
  const reader = S.reader;
  while (true) {
    const {value: f, done} = await reader.read();
    if (done) break;
    const arr = performance.now();
    if (arr - S.recStart < 500) { f.close(); continue; }    // camera pipeline settles after REC
    if (!S.encLogged) {
      S.encLogged = true;
      hublog({ev: "encoder", cfg: S.encCfg, frame: {w: f.displayWidth, h: f.displayHeight, fmt: f.format}});
      if (f.displayWidth !== S.encCfg.width || f.displayHeight !== S.encCfg.height) msg("frame size differs from encoder: " + f.displayWidth + "×" + f.displayHeight);
    }
    if (S.lastArr !== null) S.maxGapMs = Math.max(S.maxGapMs, arr - S.lastArr);
    S.lastArr = arr;
    S.frames++;
    if (S.encoder.encodeQueueSize > 8) { S.dropped++; f.close(); continue; }   // shows up as a gap
    S.pendingMeta.set(f.timestamp, arr);
    S.encoder.encode(f, {keyFrame: S.encoded % 30 === 0});
    S.encoded++;
    f.close();
  }
}
function onChunk(chunk) {
  const data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
  const arr = S.pendingMeta.get(chunk.timestamp); S.pendingMeta.delete(chunk.timestamp);
  const key = chunk.type === "key";
  if (key && S.bufFrames.length >= 60) flushChunk();
  S.buf.push(data);
  S.bufFrames.push({ts_us: chunk.timestamp, arr_ms: arr, key});
}
function flushChunk() {
  if (!S.bufFrames.length) return;
  const seq = S.seq++;
  const blob = new Blob(S.buf), meta = JSON.stringify({frames: S.bufFrames});
  S.buf = []; S.bufFrames = [];
  const item = {take: S.take, seq, blob, meta};
  S.queue.push(item);
  saveLocal(item);
  if (seq % 5 === 0) pingBurst(5);       // a clock sample every ~10 s
  pump();
}
async function saveLocal(item) {
  if (!S.chunkDir) return;
  try {
    for (const [n, d] of [[item.seq + ".h264", item.blob], [item.seq + ".json", item.meta]]) {
      const fh = await S.chunkDir.getFileHandle(n, {create: true});
      const w = await fh.createWritable(); await w.write(d); await w.close();
    }
    item.saved = true;
    if (item.seq % 15 === 0) await writeMeta(S.chunkDir, finishBody());
  } catch (e) { if (!S.saveErr) { S.saveErr = String(e); hublog({ev: "opfs_err", err: S.saveErr}); } }
}
async function writeMeta(dir, body) {
  const fh = await dir.getFileHandle("finish.json", {create: true});
  const w = await fh.createWritable(); await w.write(JSON.stringify(body)); await w.close();
}
async function putChunk(take, seq, blob, meta) {
  const base = `/api/chunk/${take}/${S.name}/${seq}`;
  let r = await fetch(base + ".h264", {method: "PUT", body: blob}); if (!r.ok) throw new Error("h264 " + r.status);
  r = await fetch(base + ".json", {method: "PUT", body: meta}); if (!r.ok) throw new Error("json " + r.status);
}
async function pump() {
  if (S.uploading) return;
  if (S.state === "recording" && !$("live").checked) return;
  S.uploading = true;
  try {
    while (S.queue.length) {
      const it = S.queue[0];
      try { await putChunk(it.take, it.seq, it.blob, it.meta); }
      catch (e) { S.lastErr = e.message; await new Promise(r => setTimeout(r, 2000)); continue; }
      S.queue.shift(); S.uploaded++; S.bytesUp += it.blob.size; S.lastErr = "";
      if (it.saved || !S.chunkDir) it.blob = null;
    }
  } finally { S.uploading = false; }
}
function finishBody() {
  return {phone: S.name, take_id: S.take, clock: S.clock, settings: S.settingsAtRec, settings_end: S.track && S.track.getSettings(),
          encoder: S.encCfg, info: {ua: navigator.userAgent, battery: S.battery && {level: S.battery.level, charging: S.battery.charging}},
          stats: {frames_seen: S.frames, encoded: S.encoded, dropped_queue: S.dropped, max_arrival_gap_ms: Math.round(S.maxGapMs),
                  hidden: S.hidden, chunks: S.seq}};
}
async function stopRec() {
  if (S.state !== "recording") return;
  setState("finishing");
  try { await S.reader.cancel(); } catch (e) {}
  if (S.encoder) { try { await S.encoder.flush(); } catch (e) {} S.encoder.close(); S.encoder = null; }
  flushChunk();
  await pingBurst(8);
  const body = finishBody();
  if (S.chunkDir) { try { await writeMeta(S.chunkDir, body); } catch (e) {} }
  setState("uploading");
  while (S.queue.length || S.uploading) { pump(); await new Promise(r => setTimeout(r, 500)); }
  await finish(S.take, body, S.chunkDir ? S.take + "_" + S.name : null);
  setState("ready");
}
async function finish(take, body, opfsName) {
  try {
    const r = await fetch(`/api/finish/${take}/${S.name}`, {method: "POST", body: JSON.stringify(body)});
    const m = await r.json();
    if (!r.ok) throw new Error(m.error || r.status);
    msg(`Done ${take}: ${m.frames} frames, ${m.duration_s} s, ${m.fps_measured} fps, ${m.dropped_frames} dropped, ts base ${m.timestamp_base}`);
    if (opfsName && !m.missing_chunks.length) { try { await S.opfs.removeEntry(opfsName, {recursive: true}); } catch (e) {} }
  } catch (e) { msg("finish failed: " + e.message + " (Upload leftovers retries)"); }
  listLeftovers();
}

// ---------- leftovers from a crash / reload
async function listLeftovers() {
  if (!S.opfs) return [];
  const out = [];
  try { for await (const [n, h] of S.opfs.entries()) if (h.kind === "directory" && n !== S.take + "_" + S.name) out.push(n); } catch (e) {}
  $("pendingmsg").textContent = out.length ? out.length + " take(s) on the phone: " + out.join(", ") : "";
  return out;
}
async function uploadLeftovers() {
  for (const n of await listLeftovers()) {
    const [take, phone] = n.split("_");
    if (phone !== S.name) continue;
    const dir = await S.opfs.getDirectoryHandle(n);
    const have = new Set((await (await fetch(`/api/have/${take}/${phone}`)).json()).have);
    let body = {phone, take_id: take, clock: []};
    const seqs = [];
    for await (const [f, h] of dir.entries()) {
      if (f === "finish.json") body = JSON.parse(await (await h.getFile()).text());
      else if (f.endsWith(".json")) seqs.push(parseInt(f));
    }
    for (const seq of seqs.sort((a, b) => a - b)) {
      if (have.has(seq)) continue;
      $("pendingmsg").textContent = `${take}: chunk ${seq}`;
      const blob = await (await dir.getFileHandle(seq + ".h264")).getFile();
      const meta = await (await (await dir.getFileHandle(seq + ".json")).getFile()).text();
      await putChunk(take, seq, blob, meta);
    }
    if (!body.clock.length) await pingBurst(8), body.clock = S.clock.slice(-8);
    await finish(take, body, n);
  }
}

// ---------- hub control
async function pollHub() {
  if (!S.name || S.state === "off") return;
  const o = offsetMs();
  const st = {phone: S.name, state: S.state, take: S.take, frames: S.encoded, dropped: S.dropped, queue: S.queue.length,
              uploaded: S.uploaded, battery: S.battery && Math.round(S.battery.level * 100), charging: S.battery && S.battery.charging,
              offset_rtt_ms: o && Math.round(o.rtt), visible: document.visibilityState, done_cmd: S.doneCmd, err: S.lastErr};
  try {
    const r = await fetch("/api/poll", {method: "POST", body: JSON.stringify(st)});
    const j = await r.json();
    if (j.cmd && j.cmd.id !== S.doneCmd) {
      S.doneCmd = j.cmd.id;
      if (j.cmd.action === "rec") startRec(j.cmd.take_id);
      if (j.cmd.action === "stop") stopRec();
    }
  } catch (e) {}
}
setInterval(pollHub, 1000);
setInterval(() => {
  const o = offsetMs();
  const rows = [["take", S.take || "–"], ["frames", S.encoded + (S.dropped ? `  (${S.dropped} dropped)` : "")],
    ["max frame gap", Math.round(S.maxGapMs) + " ms"], ["chunks", `${S.seq} made, ${S.uploaded} uploaded, ${S.queue.length} queued`],
    ["uploaded", (S.bytesUp / 1e6).toFixed(1) + " MB"], ["clock rtt", o ? o.rtt.toFixed(1) + " ms" : "–"],
    ["battery", S.battery ? Math.round(S.battery.level * 100) + "%" + (S.battery.charging ? " charging" : " NOT charging") : "–"],
    ["upload error", S.lastErr || "–"]];
  $("stats").innerHTML = rows.map(([k, v]) => `<span class="mut">${k}</span><span>${v}</span>`).join("");
}, 500);

$("connect").onclick = startCamera;
$("rec").onclick = () => startRec();
$("stop").onclick = stopRec;
$("lock").onclick = lockThese;
$("autolock").onclick = autoThenLock;
$("auto").onclick = allAuto;
$("pending").onclick = () => uploadLeftovers().catch(e => msg("leftovers: " + e.message));
$("live").onchange = pump;
$("send").onclick = () => {
  const f = $("file").files[0]; if (!f) return;
  const x = new XMLHttpRequest();
  x.open("PUT", "/api/file/" + f.name.replace(/[^A-Za-z0-9._-]/g, "_"));
  x.upload.onprogress = e => { $("sendmsg").textContent = Math.round(100 * e.loaded / e.total) + "% of " + (f.size / 1e6).toFixed(0) + " MB"; };
  x.onload = () => { $("sendmsg").textContent = x.status === 200 ? "sent ✓" : "failed " + x.status; };
  x.onerror = () => { $("sendmsg").textContent = "failed (network)"; };
  x.send(f);
};
</script>
