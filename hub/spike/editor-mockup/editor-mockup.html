<title>Multicam Editor Mock-up</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: an editing desk on one screen. Video on top; every camera as a horizontal strip
   below it, over the whole song; the bounce's waveform at the bottom. Step 2 swaps the
   strips for Instagram-style filter and effect tiles. Dark by choice: this is video work. */
:root {
  color-scheme: dark;
  --bg: #131217;
  --panel: #1b1a20;
  --lane: #201f26;
  --raised: #29272f;
  --line: #34323b;
  --fg: #ede9e3;
  --mute: #9c96a3;
  --dim: #646070;
  --accent: #f4efe6;      /* selection and focus: warm white */
  --play: #ff5d6c;        /* playhead */
  --warn: #f2c14c;
  --c1: #6fa8ff; --c2: #f29a4c; --c3: #5cc8a1; --c4: #c59bff; --c5: #f2d45c;
  --ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 8px;
  --label-w: 152px;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--ui); overflow: hidden; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%; display: grid; grid-template-rows: auto var(--top-h, 48vh) 12px minmax(0, 1fr) auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---- top bar */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.song { display: flex; align-items: baseline; gap: 10px; min-width: 0; white-space: nowrap; overflow: hidden; }
.song b { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.song .meta { color: var(--mute); overflow: hidden; text-overflow: ellipsis; }
.steps { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.steps button { border: 0; background: none; padding: 6px 18px; border-radius: 999px; cursor: pointer; color: var(--mute); font-weight: 500; display: flex; gap: 8px; align-items: center; }
.steps button .n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; background: var(--raised); color: var(--mute); }
.steps button[aria-selected="true"] { background: var(--raised); color: var(--fg); }
.steps button[aria-selected="true"] .n { background: var(--accent); color: var(--bg); }
.actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: var(--r); cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--mute); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 3px 9px; font-size: 12px; }

/* ---- video */
.top-area { min-height: 0; display: flex; flex-direction: column; }
.stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; padding-block: 12px 4px; }
.splitter { cursor: row-resize; display: grid; place-items: center; touch-action: none; border-top: 1px solid var(--line); }
.splitter::before { content: ""; width: 56px; height: 4px; border-radius: 2px; background: var(--line); transition: background 0.1s; }
.splitter:hover::before, .splitter.on::before { background: var(--mute); }
.bottom { min-height: 0; overflow: auto; }
.viewer { position: relative; width: min(100cqw, calc((100cqh - 24px) * 16 / 9)); aspect-ratio: 16 / 9; max-width: 100%;
  background: #000; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 2px var(--vc, transparent), 0 12px 40px rgba(0,0,0,0.5); transition: box-shadow 0.12s; touch-action: none; }
.viewer canvas { display: block; width: 100%; height: 100%; }
.badge { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; align-items: center; padding: 4px 9px; border-radius: 6px;
  background: rgba(10,10,12,0.72); font-size: 12px; font-weight: 500; pointer-events: none; }
.badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.badge .sub { color: var(--mute); font-weight: 400; }
.hold { position: absolute; right: 10px; bottom: 10px; padding: 4px 9px; border-radius: 6px; background: rgba(10,10,12,0.72); font-size: 12px; color: var(--mute); pointer-events: none; }
.fs { position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; border-radius: 6px; border: 0; background: rgba(10,10,12,0.6); cursor: pointer; font-size: 15px; }
.nosig { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); pointer-events: none; font-size: 14px; }

/* ---- transport */
.transport { display: flex; align-items: center; gap: 10px; padding-block: 6px; flex-wrap: wrap; }
.play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: var(--bg); cursor: pointer; font-size: 14px; display: grid; place-items: center; }
.tc { font: 500 15px var(--mono); font-variant-numeric: tabular-nums; }
.dur { color: var(--dim); font: 500 13px var(--mono); }
.onair { display: flex; align-items: center; gap: 6px; color: var(--mute); margin-left: 6px; }
.onair i { width: 9px; height: 9px; border-radius: 50%; }
.spacer { flex: 1; }
.zoom { display: flex; gap: 8px; align-items: center; color: var(--mute); }
.zoom input[type=range] { width: min(220px, 30vw); accent-color: var(--accent); }

/* ---- timeline */
.tl { display: grid; grid-template-columns: var(--label-w) minmax(0, 1fr); gap: 10px; padding-block: 6px 8px; }
.labels { position: relative; }
.lab { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 6px; background: var(--lane); border: 1px solid transparent; text-align: left; overflow: hidden; }
.lab b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; }
.lab small { display: block; color: var(--mute); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
button.lab { cursor: pointer; }
button.lab:hover { border-color: var(--cc); }
.key { flex: none; width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; font: 600 12px var(--mono); color: #111; background: var(--cc); }
.lab.on { background: color-mix(in srgb, var(--cc) 16%, var(--lane)); }
.cwrap { position: relative; min-width: 0; }
.cwrap canvas.tlc { display: block; width: 100%; touch-action: none; }
.peek { position: absolute; width: 224px; aspect-ratio: 16/9; border-radius: 6px; box-shadow: 0 0 0 2px var(--pc, #fff), 0 8px 24px rgba(0,0,0,0.6); pointer-events: none; background: #000; }

/* ---- look */
.look { padding-block: 4px 2px; display: grid; gap: 8px; }
.row-title { color: var(--mute); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding-top: 4px; }
.tiles { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin; }
.tile { flex: none; background: none; border: 0; padding: 0; cursor: pointer; display: grid; gap: 5px; justify-items: center; color: var(--mute); font-size: 12px; font-weight: 500; position: relative; }
.tile canvas { width: 112px; height: 63px; border-radius: 6px; display: block; box-shadow: 0 0 0 2px transparent; transition: box-shadow 0.1s; }
.tile:hover canvas { box-shadow: 0 0 0 2px var(--line); }
.tile.sel { color: var(--fg); }
.tile.sel canvas { box-shadow: 0 0 0 2px var(--accent); }
.tile .dot { position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px rgba(0,0,0,0.5); }
.adjust { display: flex; align-items: center; gap: 12px; min-height: 30px; color: var(--mute); flex-wrap: wrap; }
.adjust b { color: var(--fg); font-weight: 600; min-width: 80px; }
.adjust input[type=range] { width: min(360px, 50vw); accent-color: var(--accent); }
.adjust output { font: 500 13px var(--mono); color: var(--fg); min-width: 34px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }
.chip.sel { border-color: var(--accent); }

/* ---- footer */
.foot { display: flex; gap: 16px; align-items: center; padding-block: 7px 9px; border-top: 1px solid var(--line); color: var(--mute); font-size: 12px; flex-wrap: wrap; }
.foot .mock { color: var(--warn); font-weight: 500; }
.foot label { display: flex; align-items: center; gap: 8px; }
.foot input[type=range] { width: 110px; accent-color: var(--accent); }
.foot output { font: 500 12px var(--mono); color: var(--fg); }
.keys { margin-left: auto; color: var(--dim); }
.keys kbd { font: 500 11px var(--mono); color: var(--mute); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

.toast { position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--raised); border: 1px solid var(--line);
  padding: 8px 14px; border-radius: var(--r); box-shadow: 0 8px 30px rgba(0,0,0,0.5); z-index: 5; max-width: calc(100% - 32px); }

@media (max-width: 760px) {
  body { overflow: auto; }
  .app { height: auto; grid-template-rows: auto auto 0 auto auto; }
  .splitter { display: none; }
  .bottom { overflow: visible; }
  .stage { container-type: inline-size; flex: none; }
  .viewer { width: 100%; }
  .top { grid-template-columns: 1fr; justify-items: start; }
  .actions { justify-content: flex-start; }
  :root { --label-w: 92px; }
  .lab small { display: none; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

        for (const [ra, rb] of s.cam.rough) if (ra < s.b && s.a < rb) { const x0 = X(Math.max(ra, s.a)), x1 = X(Math.min(rb, s.b)); hatch(g, x0, L.y, x1 - x0, L.h, "rgba(255,255,255,0.4)", 5); }
        g.fillStyle = s.cam.hex; g.fillRect(xa, L.y, xb - xa, 5);
        if (xb - xa > 34) { g.font = "600 11px Inter, sans-serif"; const lbl = `${s.cam.key} ${s.cam.name}`; const tw = g.measureText(lbl).width;
          if (xb - xa > tw + 16) { g.fillStyle = "rgba(10,10,12,0.7)"; g.fillRect(xa + 5, L.y + 10, tw + 10, 17); g.fillStyle = s.cam.hex; g.fillText(lbl, xa + 10, L.y + 22); } }
        g.restore();
      }
      if (S.sel && S.sel.moved) {
        const xa = X(Math.min(S.sel.t0, S.sel.t1)), xb = X(Math.max(S.sel.t0, S.sel.t1));
        g.fillStyle = S.sel.cam.hex + "88"; g.fillRect(xa, L.y, xb - xa, L.h);
        g.fillStyle = S.sel.cam.hex; g.fillRect(xa, L.y, xb - xa, 5);
        const lbl = `${S.sel.cam.key} ${S.sel.cam.name} · ${fmt(Math.abs(S.sel.t1 - S.sel.t0))}`;
        g.font = "600 11px Inter, sans-serif"; const tw = g.measureText(lbl).width;
        g.fillStyle = "rgba(10,10,12,0.8)"; g.fillRect(xa + 4, L.y + 10, tw + 10, 17); g.fillStyle = "#f4efe6"; g.fillText(lbl, xa + 9, L.y + 22);
      }
      S.cuts.forEach((c, i) => {
        if (i === 0) return; const x = Math.round(X(c.t)); if (x < -8 || x > w + 8) return;
        const sel = i === S.selCut || (S.drag && S.drag.i === i), hot = S.hover && S.hover.handle === i;
        g.fillStyle = sel ? "#f4efe6" : c.by === "you" ? "rgba(244,239,230,0.95)" : "rgba(244,239,230,0.6)";
        g.fillRect(x - 1, L.y, 2, L.h);
        const kh = 18, kw = sel || hot ? 9 : 7; g.beginPath(); if (g.roundRect) g.roundRect(x - kw / 2, L.y + L.h / 2 - kh / 2, kw, kh, 3); else g.rect(x - kw / 2, L.y + L.h / 2 - kh / 2, kw, kh); g.fill();
        if (sel) { g.strokeStyle = "#131217"; g.lineWidth = 1.5; g.stroke(); }
      });
    } else if (L.type === "cam") {
      const cam = L.cam;
      laneBg(g, L, w);
      g.save(); g.beginPath(); g.rect(0, L.y, w, L.h); g.clip();
      tiles(g, cam, L.y, L.h, 0, w);
      for (const s of segs) if (s.cam !== cam) { const xa = X(s.a), xb = X(s.b); if (xb > 0 && xa < w) { g.fillStyle = "rgba(19,18,23,0.62)"; g.fillRect(xa, L.y, xb - xa, L.h); } }
      for (const [a, b] of [[0, cam.from], [cam.to, DUR]]) if (b > a) { const xa = X(a), xb = X(b); g.fillStyle = "#0e0d11"; g.fillRect(xa, L.y, xb - xa, L.h); hatch(g, xa, L.y, xb - xa, L.h, "rgba(255,255,255,0.07)"); }
      for (const [a, b] of cam.rough) { const xa = X(a), xb = X(b); g.fillStyle = "rgba(19,18,23,0.5)"; g.fillRect(xa, L.y, xb - xa, L.h); hatch(g, xa, L.y, xb - xa, L.h, "rgba(255,255,255,0.35)", 5); }
      for (const s of segs) if (s.cam === cam) { const xa = X(s.a), xb = X(s.b); g.strokeStyle = cam.hex; g.lineWidth = 2; g.strokeRect(xa + 1, L.y + 1, xb - xa - 2, L.h - 2); g.fillStyle = cam.hex; g.fillRect(xa, L.y + L.h - 4, xb - xa, 4); }
      if (S.sel && S.sel.moved && S.sel.cam === cam) {
        const xa = X(Math.min(S.sel.t0, S.sel.t1)), xb = X(Math.max(S.sel.t0, S.sel.t1));
        g.fillStyle = cam.hex + "66"; g.fillRect(xa, L.y, xb - xa, L.h);
        g.strokeStyle = "#f4efe6"; g.lineWidth = 2; g.strokeRect(xa + 1, L.y + 1, xb - xa - 2, L.h - 2);
      }
      g.restore();
    } else if (L.type === "wave") {
      for (const s of segs) { const xa = X(s.a), xb = X(s.b); if (xb > 0 && xa < w) { g.fillStyle = s.cam.hex + "1c"; g.fillRect(xa, L.y, xb - xa, L.h); } }
      const mid = L.y + L.h / 2, px = X(S.playhead);
      for (let x = 0; x < w; x += 2) {
        const ta = S.view0 + x / S.pps, tb = S.view0 + (x + 2) / S.pps;
        let m = 0; for (let k = Math.floor(ta * PEAK_RATE); k <= Math.min(PEAKS.length - 1, Math.floor(tb * PEAK_RATE)); k++) m = Math.max(m, PEAKS[k]);
        const a = Math.max(0.5, m * L.h * 0.48);
        g.fillStyle = x < px ? "#b3acbd" : "#5f5a69"; g.fillRect(x, mid - a, 1.5, a * 2);
      }
    }
  }
  if (S.hover && S.hover.tl === tl && !S.drag) {
    const x = Math.round(X(S.hover.t)), top = lanes[1].y;
    g.fillStyle = "rgba(244,239,230,0.5)"; g.fillRect(x, top, 1, tl.h - top);
    const lbl = fmt(S.hover.t); g.font = "500 10px 'JetBrains Mono', monospace"; const tw = g.measureText(lbl).width + 10;
    const bx = clamp(x - tw / 2, 0, w - tw); g.fillStyle = "#3a3842"; g.fillRect(bx, 0, tw, 16); g.fillStyle = "#ede9e3"; g.fillText(lbl, bx + 5, 11);
  }
  const px = Math.round(X(S.playhead));
  if (px >= -6 && px <= w + 6) {
    g.fillStyle = "#ff5d6c"; g.fillRect(px - 1, 2, 2, tl.h - 2);
    g.beginPath(); g.moveTo(px - 6, 0); g.lineTo(px + 6, 0); g.lineTo(px, 8); g.closePath(); g.fill();
  }
  // a live peek at the hovered camera while playing (when paused, the video window itself skims)
  const pk = tl.peek;
  if (pk) {
    const hv = S.hover;
    if (S.playing && hv && hv.tl === tl && hv.lane && hv.lane.type === "cam") {
      pk.hidden = false;
      pk.style.left = clamp(hv.x - 112, 0, w - 224) + "px"; pk.style.top = Math.max(0, hv.lane.y - 132) + "px";
      pk.style.setProperty("--pc", hv.lane.cam.hex);
      const pg = pk.getContext("2d"); drawCam(pg, hv.lane.cam, hv.t, pk.width, pk.height);
    } else pk.hidden = true;
  }
}

function layout(kind) {
  const L = []; let y = 0;
  const add = (o, hh, gap) => { L.push({ ...o, y, h: hh }); y += hh + gap; };
  add({ type: "ruler" }, 18, 4);
  if (kind === "cut") { add({ type: "program" }, 58, 12); CAMS.forEach((c, i) => add({ type: "cam", cam: c }, 44, i < CAMS.length - 1 ? 6 : 12)); add({ type: "wave" }, 50, 0); }
  else { add({ type: "program" }, 46, 8); add({ type: "wave" }, 40, 0); }
  L.total = y;
  return L;
}

// =================================================================== the frame loop
const viewer = { canvas: null, wrap: null, badge: null, nosig: null };
const ui = { tc: null, onair: null };
const tileCanvases = new Map();
let lastTiles = 0, lastBadge = "";
function loop(now) {
  frameNo++;
  if (S.playing) {
    S.playhead = clock();
    if (S.playhead >= DUR) { pause(); S.playhead = DUR; }
    const w = curW();
    if (!S.fit && (S.playhead - S.view0) * S.pps > w * 0.92) { S.view0 = S.playhead - w * 0.1 / S.pps; clampView(); }
  }
  const skimming = S.skim && !S.playing && !S.scrubbing && !S.drag;
  const t = skimming ? S.skim.t : S.playhead;
  const shown = skimming && S.skim.cam ? S.skim.cam : camAt(t);
  const bg = B.getContext("2d");
  const ok = skimming && S.skim.cam ? drawCam(bg, S.skim.cam, t, BW, BH) : drawProgram(bg, t, BW, BH);
  if (viewer.canvas) {
    applyLook(viewer.canvas.getContext("2d"), B, viewer.canvas.width, viewer.canvas.height, S.compare ? NOLOOK : S.look, t);
    viewer.wrap.style.setProperty("--vc", skimming ? shown.hex : "transparent");
    viewer.nosig.textContent = ok ? "" : `${shown.name} wasn't recording here`;
    const b = skimming ? `<i style="background:${shown.hex}"></i>${shown.key} ${shown.name}<span class="sub">· ${fmt(t)}${S.skim.cam && S.step === "cut" ? " · click to show from here" : ""}</span>`
                       : `<i style="background:${shown.hex}"></i>${shown.key} ${shown.name}`;
    if (b !== lastBadge) { viewer.badge.innerHTML = b; lastBadge = b; }
  }
  for (const tl of timelines) drawTimeline(tl);
  if (ui.tc) ui.tc.textContent = fmt(S.playhead);
  if (ui.onair) { const c = camAt(S.playhead); ui.onair.innerHTML = `<i style="background:${c.hex}"></i>On: ${c.key} ${c.name}`; }
  if (S.step === "look" && now - lastTiles > 350) {
    lastTiles = now;
    for (const [key, cv] of tileCanvases) {
      if (!cv.isConnected) continue;
      const g = cv.getContext("2d"), [kind, id] = key.split(":");
      let look;
      if (kind === "f") look = { filter: id, strength: { [id]: S.look.strength[id] ?? 1 }, effects: {} };
      else look = { filter: S.look.filter, strength: S.look.strength, effects: { [id]: S.look.effects[id] ?? EMAP[id].def } };
      applyLook(g, B, cv.width, cv.height, look, t);
    }
  }
  requestAnimationFrame(loop);
}

// =================================================================== components
function Header() {
  const setStep = s => { S.step = s; S.hover = null; S.skim = null; S.adjust = null; S.selCut = -1; bump(); };
  return html`<header class="top">
    <div class="song"><b>Track 2</b><span class="meta">bounce v3 · take 15 Nov 23:11 · 2:40</span></div>
    <nav class="steps" role="tablist" aria-label="Steps">
      <button role="tab" aria-selected=${String(S.step === "cut")} onClick=${() => setStep("cut")}><span class="n">1</span>Cut</button>
      <button role="tab" aria-selected=${String(S.step === "look")} onClick=${() => setStep("look")}><span class="n">2</span>Look</button>
    </nav>
    <div class="actions">
      <button class="btn" disabled=${!S.undo.length} onClick=${undo} title="Undo (⌘Z)">Undo</button>
      <button class="btn" disabled=${!S.redo.length} onClick=${redo} title="Redo (⇧⌘Z)">Redo</button>
      <button class="btn primary" onClick=${() => toast("In the real editor this renders the video on the hub: about 3 minutes for this song.")}>Make video</button>
    </div>
  </header>`;
}

function Viewer() {
  const c = useRef(), wrap = useRef(), badge = useRef(), nosig = useRef();
  useEffect(() => { Object.assign(viewer, { canvas: c.current, wrap: wrap.current, badge: badge.current, nosig: nosig.current }); lastBadge = ""; }, []);
  const hold = on => { if (S.step === "look") { S.compare = on; bump(); } };
  const full = e => { e.stopPropagation(); const el = wrap.current; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (el.requestFullscreen) el.requestFullscreen().catch(() => toast("Full screen isn't available here")); };
  return html`<div class="stage"><div class="viewer" ref=${wrap}
      onPointerDown=${() => hold(true)} onPointerUp=${() => hold(false)} onPointerLeave=${() => hold(false)}>
    <canvas ref=${c} width="960" height="540" aria-label="Video preview"></canvas>
    <div class="nosig" ref=${nosig}></div>
    <div class="badge" ref=${badge}></div>
    ${S.step === "look" && html`<div class="hold">${S.compare ? "Without the look" : "Press and hold to compare"}</div>`}
    <button class="fs" onPointerDown=${e => e.stopPropagation()} onClick=${full} title="Full screen" aria-label="Full screen">⤢</button>
  </div></div>`;
}

function Transport() {
  return html`<div class="transport">
    <button class="play" onClick=${togglePlay} aria-label=${S.playing ? "Pause" : "Play"} title="Play / pause (space)">${S.playing ? "❚❚" : "▶"}</button>
    <button class="btn small" onClick=${() => stepFrames(-1)} title="Back one frame (←)" aria-label="Back one frame">◀︎ 1</button>
    <button class="btn small" onClick=${() => stepFrames(1)} title="Forward one frame (→)" aria-label="Forward one frame">1 ▶︎</button>
    <span class="tc" ref=${el => ui.tc = el}>${fmt(S.playhead)}</span><span class="dur">/ ${fmt(DUR)}</span>
    <span class="onair" ref=${el => ui.onair = el}></span>
    <span class="spacer"></span>
    <label class="zoom" for="zoom">Zoom
      <input id="zoom" type="range" min="0" max="1000" value=${zoomValue()} aria-label="Zoom"
        onInput=${e => { const minP = curW() / DUR, p = minP * Math.exp(e.target.value / 1000 * Math.log(MAX_PPS / minP)); zoomAround(p / S.pps, S.playhead); }}/>
    </label>
  </div>`;
}

function Timeline({ kind }) {
  const cv = useRef(), wrap = useRef(), peek = useRef();
  const lanes = layout(kind);
  useEffect(() => {
    const tl = { kind, canvas: cv.current, lanes, w: 0, h: lanes.total, peek: peek.current };
    const ro = new ResizeObserver(() => {
      const w = wrap.current.clientWidth; tl.w = w;
      tl.canvas.width = Math.round(w * DPR); tl.canvas.height = Math.round(tl.h * DPR); tl.canvas.style.height = tl.h + "px";
      if (S.fit) { S.pps = w / DUR; S.view0 = 0; } clampView(); tileCache.clear();
    });
    ro.observe(wrap.current);
    timelines.add(tl);
    const c = tl.canvas;
    const local = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    const laneAt = y => lanes.find(L => y >= L.y - 3 && y < L.y + L.h + 3) || null;
    const tAt = x => clamp(S.view0 + x / S.pps, 0, DUR);
    const handleAt = (x, lane) => { if (!lane || lane.type !== "program") return -1; for (let i = 1; i < S.cuts.length; i++) if (Math.abs((S.cuts[i].t - S.view0) * S.pps - x) < 7) return i; return -1; };
    function move(e) {
      const { x, y } = local(e), t = tAt(x), lane = laneAt(y);
      if (S.drag) {
        const i = S.drag.i, lo = S.cuts[i - 1].t + 0.2, hi = (i + 1 < S.cuts.length ? S.cuts[i + 1].t : DUR) - 0.2;
        const nt = clamp(t, lo, hi); if (Math.abs(nt - S.cuts[i].t) > 1e-4) S.drag.moved = true;
        S.cuts[i] = { ...S.cuts[i], t: nt, by: "you" }; if (!S.playing) S.playhead = nt + 0.001; return;
      }
      if (S.sel) {
        S.sel.t1 = t; if (Math.abs(x - S.sel.x0) > 4) S.sel.moved = true;
        S.hover = { tl, t, x, lane }; S.skim = { cam: S.sel.cam, t }; return;
      }
      if (S.scrubbing) { S.playhead = t; S.hover = { tl, t, x, lane }; return; }
      const hi = handleAt(x, lane);
      S.hover = { tl, t, x, lane, handle: hi };
      S.skim = lane && lane.type !== "ruler" ? { cam: lane.type === "cam" ? lane.cam : null, t } : (lane ? { cam: null, t } : null);
      c.style.cursor = hi > 0 ? "ew-resize" : lane && lane.type === "cam" ? "crosshair" : "default";
    }
    function down(e) {
      if (e.button !== 0) return;
      c.setPointerCapture(e.pointerId);
      const { x, y } = local(e), t = tAt(x), lane = laneAt(y);
      const hi = handleAt(x, lane);
      if (hi > 0) { snapshot(); S.drag = { i: hi, moved: false }; S.selCut = hi; bump(); return; }
      if (lane && lane.type === "cam") { S.sel = { cam: lane.cam, t0: t, t1: t, x0: x, moved: false }; S.selCut = -1; return; }
      S.scrubbing = true; S.wasPlaying = S.playing; if (S.playing) pause();
      S.playhead = t; S.selCut = -1; bump();
    }
    function up(e) {
      if (S.sel) {
        const sel = S.sel; S.sel = null;
        if (sel.moved) { applyRange(sel.cam, Math.min(sel.t0, sel.t1), Math.max(sel.t0, sel.t1)); setPlayhead(Math.min(sel.t0, sel.t1)); }
        else setPlayhead(sel.t0);              // a plain click just moves the playhead
        bump(); return;
      }
      if (S.drag) { if (!S.drag.moved) S.undo.pop(); else normalize(); S.drag = null; bump(); }
      if (S.scrubbing) { S.scrubbing = false; if (S.wasPlaying) play(); }
    }
    function leave() { if (!S.drag && !S.scrubbing && !S.sel) { S.hover = null; S.skim = null; } }
    function wheel(e) {
      e.preventDefault();
      if (e.ctrlKey || e.metaKey) { zoomAround(Math.exp(-e.deltaY * 0.01), tAt(local(e).x)); return; }
      S.view0 += (e.deltaX + (Math.abs(e.deltaX) > 0 ? 0 : e.deltaY)) / S.pps; clampView();
      if (S.hover) S.hover.t = tAt(S.hover.x);
    }
    c.addEventListener("pointermove", move); c.addEventListener("pointerdown", down); c.addEventListener("pointerup", up);
    c.addEventListener("pointercancel", up); c.addEventListener("pointerleave", leave); c.addEventListener("wheel", wheel, { passive: false });
    return () => { ro.disconnect(); timelines.delete(tl); };
  }, []);
  const prog = camAt(S.playhead);
  return html`<section class="tl" aria-label="Timeline">
    <div class="labels" style=${{ height: lanes.total + "px" }}>
      ${lanes.map(L => L.type === "program" ? html`<div class="lab" style=${{ top: L.y + "px", height: L.h + "px" }}><div><b>Video</b><small>what's showing</small></div></div>`
        : L.type === "cam" ? html`<button class=${"lab" + (prog === L.cam ? " on" : "")} style=${{ top: L.y + "px", height: L.h + "px", "--cc": L.cam.hex }}
              onClick=${() => cutAt(S.playhead, L.cam)} title=${`Show ${L.cam.name} from the playhead (key ${L.cam.key})`}>
              <span class="key">${L.cam.key}</span><span style="min-width:0"><b>${L.cam.name}</b><small>${L.cam.note}</small></span></button>`
        : L.type === "wave" ? html`<div class="lab" style=${{ top: L.y + "px", height: L.h + "px" }}><div><b>Bounce</b><small>Track 2 · v3</small></div></div>` : null)}
    </div>
    <div class="cwrap" ref=${wrap}>
      <canvas class="tlc" ref=${cv} aria-label="Cameras and cut over the song. Hover to look; press, drag and release on a camera to use it for that stretch."></canvas>
      ${kind === "cut" && html`<canvas class="peek" ref=${peek} width="448" height="252" hidden></canvas>`}
    </div>
  </section>`;
}

function LookPanel() {
  const nfx = Object.keys(S.look.effects).length;
  const tapFilter = id => { if (S.look.filter === id) S.adjust = id !== "normal" && S.adjust !== "filter" ? "filter" : null; else { S.look.filter = id; S.adjust = null; } bump(); };
  const tapEffect = id => { if (S.look.effects[id] == null) { S.look.effects[id] = EMAP[id].def; S.adjust = id; } else S.adjust = S.adjust === id ? null : id; bump(); };
  let adjust;
  if (S.adjust === "filter") {
    const f = FMAP[S.look.filter], v = Math.round((S.look.strength[f.id] ?? 1) * 100);
    adjust = html`<b>${f.name}</b><input id="filter-strength" type="range" min="0" max="100" value=${v} aria-label=${f.name + " strength"}
        onInput=${e => { S.look.strength[f.id] = e.target.value / 100; lastTiles = 0; bump(); }}/><output>${v}</output>
        <button class="btn small" onClick=${() => { S.adjust = null; bump(); }}>Done</button>`;
  } else if (S.adjust && EMAP[S.adjust]) {
    const e = EMAP[S.adjust], v = Math.round(S.look.effects[e.id] * 100);
    adjust = html`<b>${e.name}</b><input id="effect-strength" type="range" min="1" max="100" value=${v} aria-label=${e.name + " strength"}
        onInput=${ev => { S.look.effects[e.id] = ev.target.value / 100; lastTiles = 0; bump(); }}/><output>${v}</output>
        <button class="btn small" onClick=${() => { delete S.look.effects[e.id]; S.adjust = null; bump(); }}>Remove</button>
        <button class="btn small" onClick=${() => { S.adjust = null; bump(); }}>Done</button>`;
  } else {
    adjust = html`<span>Tap a filter to try it, an effect to add it. Tap again for its strength. Effects stack.</span>
      <span class="chips">${Object.entries(S.look.effects).map(([id, val]) => html`<button class="chip" onClick=${() => { S.adjust = id; bump(); }}>${EMAP[id].name} ${Math.round(val * 100)}</button>`)}</span>`;
  }
  const tile = (kind, x, sel, on, tap) => html`<button class=${"tile" + (sel ? " sel" : "")} key=${kind + x.id} onClick=${() => tap(x.id)} aria-pressed=${String(sel || on)}>
      <canvas width="224" height="126" ref=${el => { if (el) tileCanvases.set(kind + ":" + x.id, el); }}></canvas>${x.name}${on && html`<i class="dot"></i>`}</button>`;
  return html`<section class="look" aria-label="Look">
    <div class="row-title">Filters</div>
    <div class="tiles">${FILTERS.map(x => tile("f", x, S.look.filter === x.id, false, tapFilter))}</div>
    <div class="row-title">Effects${nfx ? ` · ${nfx} on` : ""}</div>
    <div class="tiles">${EFFECTS.map(x => tile("e", x, S.adjust === x.id, S.look.effects[x.id] != null, tapEffect))}</div>
    <div class="adjust">${adjust}</div>
  </section>`;
}

function Splitter() {
  const down = e => {
    const el = e.currentTarget; el.setPointerCapture(e.pointerId); el.classList.add("on");
    const top = el.previousElementSibling.getBoundingClientRect().top;
    const move = ev => { S.topH = Math.round(clamp(ev.clientY - top, 140, window.innerHeight - 200)); bump(); };
    const up = () => { el.classList.remove("on"); el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up);
      try { localStorage.setItem("mc-top-h", String(S.topH)); } catch (err) {} };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up);
  };
  return html`<div class="splitter" role="separator" aria-orientation="horizontal" aria-label="Drag to resize the video" onPointerDown=${down}
    onDblClick=${() => { S.topH = null; try { localStorage.removeItem("mc-top-h"); } catch (e) {} bump(); }} title="Drag to make the video bigger or smaller (double-click to reset)"></div>`;
}

function Footer() {
  return html`<footer class="foot">
    <span class="mock">Mock-up: made-up pictures and music</span>
    <label for="dissolve">Dissolve <input id="dissolve" type="range" min="0" max="0.8" step="0.05" value=${S.dissolve} onInput=${e => { S.dissolve = +e.target.value; bump(); }}/><output>${S.dissolve.toFixed(2)} s</output></label>
    ${S.step === "cut" && html`<button class="btn small" onClick=${resetAuto}>Back to the automatic cut</button>`}
    <span class="keys"><kbd>space</kbd> play · drag on a camera to use it there · <kbd>1</kbd>–<kbd>5</kbd> camera from the playhead · <kbd>←</kbd><kbd>→</kbd> frame · <kbd>⌫</kbd> remove cut · <kbd>⌘Z</kbd> undo · pinch or <kbd>⌘</kbd>+scroll to zoom</span>
  </footer>`;
}

function App() {
  const [, set] = useState(0);
  rerender = () => set(x => x + 1);
  return html`<div class="app" style=${S.topH ? { "--top-h": S.topH + "px" } : null}>
    <${Header}/>
    <div class="top-area"><${Viewer}/><${Transport}/></div>
    <${Splitter}/>
    <div class="bottom">
      ${S.step === "cut" ? html`<${Timeline} kind="cut" key="cut"/>` : html`<${LookPanel} key="lp"/><${Timeline} kind="look" key="look"/>`}
    </div>
    <${Footer}/>
    ${S.toast && html`<div class="toast" role="status">${S.toast}</div>`}
  </div>`;
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && !["Space", "KeyZ"].includes(e.code)) return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (/^Digit[1-5]$/.test(e.code) && !e.metaKey && !e.ctrlKey && S.step === "cut") cutAt(clock(), CAMS[+e.code.slice(5) - 1]);
  else if (e.key === "ArrowLeft") { e.preventDefault(); e.shiftKey ? setPlayhead(clock() - 1) : stepFrames(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); e.shiftKey ? setPlayhead(clock() + 1) : stepFrames(1); }
  else if ((e.key === "Backspace" || e.key === "Delete") && S.selCut > 0) { e.preventDefault(); deleteCut(S.selCut); }
  else if (e.code === "KeyZ" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (e.key === "+" || e.key === "=") zoomAround(1.5, clock());
  else if (e.key === "-") zoomAround(1 / 1.5, clock());
});

render(html`<${App}/>`, document.getElementById("root"));
requestAnimationFrame(loop);
</script>
